# ARCHIVED scenario-epoch environment (read-only shim).
# The canonical Python runtime is the pack at orchestrator/src/raidar/packs/python
# (reboot plan WS-I): a scorer-free agent image plus lazily provisioned tools.
# This entry bakes scorer tools into the agent image, which the pack forbids; it is
# kept only so archived scenarios still resolve, and is removed with the scenario
# execution path in plan L1.
id: python:3.12
version: 1
image: raidar/python:3.12-code
build:
  dockerfile: Dockerfile
capabilities:
  runtimes:
    python: ">=3.12"
  package_managers:
    pip: ">=24"
  tools:
    git: ">=2"
    pytest: ">=9"
    coverage: ">=7"
    ruff: ">=0.14"
    lizard: ">=1.17"
  browsers: {}
