# Guardrails A/B on forge: does a repository that refuses a commit until a mechanical
# Python guardrail gate passes change correctness and quality, against the shared framing alone?
# Explore iteration 3 (rationale.md section 12): the gate also runs the agent's OWN tests.
# Iteration 3b (rationale.md section 13, after smoke-03): python-guardrails@4 (@3 whose gate also
# checks extensionless python scripts and the targets of .py symlinks), continue-on-stall@2
# (no-edit refusals stall too; one continuation per step, for its first session only) and
# transient-retry@1 (a session the provider drops is retried, at most twice), both shared;
# scorer gate-effort@5 (@4 with v4-family evidence text).
# Iteration 3b.2 (rationale.md section 14, after smoke-04): python-guardrails@5 (@4 with the
# pack's pinned pytest, coverage, ruff and mypy on the agent's PATH, in both arms),
# process-compliance@4 (a test command counts only when it ran; the pack's gate command counts
# as a test run through scorer_config) and gate-effort@6 (a failed tests check counted once;
# blocking counts comparable across gate modes; the no-untyped-call cascade apart; failing
# tests and missed coverage split). The analysis tables now name each metric's better direction.
# The verifier's per-test coverage pass moves off the trial's critical path
# (protocol.verifier_coverage: offline; scorer code-quality@2 reads the offline run).
# Iteration 3b.3 (rationale.md section 15, after smoke-3b-2): python-guardrails@6 (@5 with
# PLR0904, too-many-public-methods, off in test files: a broad unittest TestCase is not a
# design smell), gate-effort@7 (@6 plus first-pass clean rates that ignore auto-fixable layout
# codes, the tests check or both, and the cross-mode blocking counts without the
# no-untyped-call cascade) and process-compliance@5 (@4 plus the work session's own test runs;
# plan_written leaves compliance_rate, since no condition asks for a plan).
# Iteration 3b.4 (rationale.md section 16, after smoke-3b-3): python-guardrails@7 (@6 whose
# pinned pytest and coverage, and only those, the image's own python imports: python -m pytest
# works in both arms), process-compliance@6 (@5 plus whether the work session ran the tests at
# all, and after its last edit to a non-test file) and gate-effort@8 (@7 plus the cross-mode
# counts with a refused suppression comment counted once: mypy's unused-ignore at a SUPPRESS
# line folded into it). The primary outcome and the errata are unchanged (16.1, I1).
# Iteration 3b.5 (rationale.md section 17, after smoke-3b-4): code-quality@3 (@2 whose G leaves
# out at most 3 grader cases whose outcome differs between the grading run and the coverage run,
# instead of reading the whole step, and so the trial's headline, as ineligible; it reports how
# many cases it left out per transition). Agent, pack, gate, wrappers and the offline coverage
# pass are unchanged.
# Iteration 4 (rationale.md section 18, after main-03; user decision 2026-10-07, option b: one
# more explore iteration on fix-session cost): python-guardrails@8 (@7 plus its safe auto-fixers
# as 'guardrail-check --autofix': ruff format and ruff's safe fixes only, protected config, scope
# files only, atomic, reported) in both arms; guardrail-gate@4 (@3 plus autofix_before_check):
# r2 runs the autofix before every commit check (re-staged, then the real commit with
# guardrail-check as the pre-commit hook, exactly as @3), r1's shadow gate runs it on a throwaway
# copy and records the fixed copy's check beside the raw one (the workspace stays byte-identical
# and the agent sees nothing); scorer gate-effort@9 (@8 plus the autofix step, the counts after
# and before it, and the fix cost by refusal kind). Correctness, quality, process scorers,
# agent, wrappers, verifier coverage, errata and primary unchanged.
# r2 gets python-guardrails@7 (the @1 rule set and pins, PLR0904 off in test files, plus the tests check:
# unittest always, pytest for pytest-style tests, both under coverage; a Python change with no
# test that ran is refused, so are failing tests and owned line coverage below 85%), installed
# once per trial at environment start (root-owned under /opt/raidar-tools/python-guardrails,
# hash-pinned pytest 9.1.1 and coverage 7.16.2 beside Ruff and mypy; nothing in the agent
# image; the pack's pytest, coverage, ruff and mypy are linked on the agent's PATH, and its
# pytest and coverage are importable by the image's python, as a repository's dev environment
# would provide them), with ruff.toml and mypy.ini copies in /app,
# and guardrail-gate@3 in commit mode (as @2, plus a snapshot of /app before each fix session,
# graded offline beside the step's final snapshot). r1 gets the same pack without the
# workspace copies and the same gate in shadow mode (recorded at each step's end outside /app,
# never enforced; its test run happens in a throwaway copy, so nothing reaches /app).
# Both arms share the starter framing, continue-on-stall@2 (a step whose first session changes
# nothing and ends asking a question or saying it cannot proceed without more information gets
# one continuation: no human is available; proceed on the spec and reasonable assumptions
# recorded in ASSUMPTIONS.md, before the gate runs) and transient-retry@1.
# No rules text tells the agent about the gate in advance (the mechanical rung only).
# Objective: explore (smallest runs: 1 trial per arm first, then at most 4 attempts per arm).
# Verdicts below min_pairs read insufficient by design.
# Pre-registration: rationale.md beside this file. Section 18 (iteration 4) amends section 17,
# section 17 (iteration 3b.5) amends section 16
# (iteration 3b.4), which amends section 15
# (iteration 3b.3), which amends section 14
# (iteration 3b.2), which amends section 13,
# which amends section 12, which pre-registers the hypothesis (enforcing the agent's own tests
# prevents fix-round regressions) and the secondary outcomes (gate.fix_round_correctness_delta,
# process.stall_rate, coverage, gate effort); the primary stays solve_rate_errata with raw
# solve_rate beside it.
# Validate: make experiment-validate EXPERIMENT=experiments/ab-test/python__forge__guardrails/experiment.yaml
# Lock:     make experiment-lock EXPERIMENT=experiments/ab-test/python__forge__guardrails/experiment.yaml
schema_version: 2
kind: ab-test
id: python__forge__guardrails
description: Does a commit gate enforcing the python-guardrails rule set change correctness and code quality on forge?

problems:
  # SCB Harbor dataset, pinned to scb-problems@38d627ecf668 (8 checkpoints); the lock pins
  # the forge errata (sha256 9a6dec369dea).
  - ref: scb/forge@38d627ecf668

runtime: python
environment:
  type: docker
  compose_init: true

agents:
  # Real-LLM policy: codex + gpt-6-luna at low effort.
  - id: codex-luna
    name: codex
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact
  # Iteration 3b.2 (user decision 2026-10-06; rationale.md section 14): the verifier's per-test
  # coverage pass (G's evidence; about 1077 s of each smoke-04 trial) runs offline at
  # assessment from the stored step snapshots, not after every step. The verdict run is
  # unchanged; code-quality@2 reads the offline run.
  verifier_coverage: offline

factors: [condition]

# Both arms get the same framing (pilot v2): where to work, that /app may start empty,
# what to build, and that nobody answers questions; the same stall continuation
# (continue-on-stall@2, a session wrapper: it runs inside the gate, before the gate runs, and
# only a step's first session can be continued); and the same retry of a session the model
# provider drops (transient-retry@1, innermost: at most 2 retries, 60 s then 180 s apart).
shared_components:
  - use: prompt-wrapper@1
    files: [components/shared/starter-framing.md]
  - use: continue-on-stall@2
  - use: transient-retry@1

conditions:
  - id: r1-baseline
    components:
      # The same pack, installed outside /app at environment start, with nothing in the
      # workspace: the agent sees no ruff.toml or mypy.ini. Its probe proves at every step the
      # pinned tools, the install-time smoke and an unchanged tool tree, and at step 1 that no
      # config copy is in /app.
      - use: python-guardrails@8
        with:
          workspace_configs: false
      # The same commit check in shadow mode: run once at each step's end against a git
      # directory outside /app, its tests in a throwaway copy (the workspace is never
      # written), recorded with its git evidence, never enforced (no refusal, no fix session,
      # so no pre-fix snapshot). Iteration 4: the pack's autofix then runs on a throwaway copy
      # of /app outside it and the same shadow check runs on the fixed copy (post-autofix
      # findings beside the raw ones); /app stays byte-identical and the agent sees nothing.
      - use: guardrail-gate@4
        with:
          command: guardrail-check
          mode: shadow
          max_rounds: 3
          timeout_sec: 300
          autofix_before_check: true
          autofix_command: guardrail-check --autofix
  - id: r2-guardrails
    components:
      # The pack: the gate entrypoint (the agent's own tests included), its pinned tools and
      # protected configs, and the workspace config copies. Its probe proves at every step
      # the pinned versions, the install-time smoke (a clean file with its test passes, an
      # unused import is refused) and an unchanged tool tree; its integrity flags record
      # config-copy edits, tree changes and hook-bypass attempts without failing the step.
      - use: python-guardrails@8
        with:
          workspace_configs: true
      # The repository's commit gate. The hook command is plain `guardrail-check`, as in a
      # real repository; the gate's JSON report (tests block included) goes to the run's
      # report dir, where gate-effort@4 reads it; every commit attempt records git evidence,
      # and /app is snapshotted before each fix session for the offline pre-fix grade.
      # Iteration 4: before every commit check (the step-end one and each re-check after a fix
      # session) the pack's safe auto-fixers run on /app and the result is re-staged, as a
      # repository's pre-commit autofix hooks do; a failed autofix is typed and that check runs
      # as guardrail-gate@3's.
      - use: guardrail-gate@4
        with:
          command: guardrail-check
          mode: commit
          max_rounds: 3
          timeout_sec: 300
          autofix_before_check: true
          autofix_command: guardrail-check --autofix

arms:
  - id: r1-baseline
    condition: r1-baseline
    agent: codex-luna
  - id: r2-guardrails
    condition: r2-guardrails
    agent: codex-luna

assessment:
  # Iteration 3 (rationale.md section 12): gate-effort@4 is @3 plus the tests check
  # (first run and step end, owned coverage) and fix_round_correctness_delta (final minus
  # pre-fix case pass rate; make experiment-assess grades the pre-fix snapshots into the
  # store first); process-compliance@3 is @2 plus stall_rate (continue-on-stall@1 records).
  # Iteration 3b: gate-effort@5 is @4 with the gate runs' evidence summaries counting TEST.*
  # findings in the tests family (values unchanged).
  # Iteration 3b.2: process-compliance@4 is @3 counting a test command only when its output does
  # not say its runner was not found, plus test_commands_not_run; the pack's gate runs the
  # project's tests, so it counts as a test run (the same pattern in both arms).
  # gate-effort@6 is @5 with a failed tests check counted once, step-end/new/final blocking
  # counts, the MYPY.no-untyped-call cascade apart and the first-run tests outcomes split.
  # code-quality@2 is @1 whose G reads the offline coverage run (protocol.verifier_coverage:
  # offline) that make experiment-assess makes into the store first.
  # Iteration 3b.3: gate-effort@7 is @6 plus first_pass_clean_except_{autofix,tests,
  # autofix_tests} and the *_ex_cascade cross-mode counts; process-compliance@5 is @4 plus
  # work_session_tests_run_before_finish (the gate's fix sessions do not count), with
  # plan_written out of compliance_rate (plan_in_compliance_rate stays false: no condition asks
  # for a plan).
  # Iteration 3b.4: process-compliance@6 is @5 plus work_session_tests_run_any and
  # work_session_tests_after_last_code_edit (test-file edits after the run do not fail it);
  # gate-effort@8 is @7 plus the *_net cross-mode counts (no cascade; a refused suppression
  # comment's MYPY.unused-ignore folded into its SUPPRESS).
  # Iteration 3b.5: code-quality@3 is @2 whose G, when parity failed only because at most 3
  # cases changed outcome between the grading and coverage runs, leaves those cases out of both
  # runs instead of the step; regression_parity_excluded_cases reports them.
  # Iteration 4: gate-effort@9 is @8 plus guardrail-gate@4's autofix step (passes, errors, files
  # and lines changed, block-tier findings fixed by family), first-pass clean and blocking
  # counts after autofix and before it (comparable across the enforced and the shadow arm), and
  # the fix sessions' cost and wall time by the kind of refusal that started them.
  # Iteration 4 record (rationale.md section 18.11, 2026-10-08; assessment only, after main-04):
  # gate-effort@10 is @9 plus new_autofix_lines_changed and new_autofix_removed_blocking (by
  # family): each step's first autofix pass minus what the previous step left for autofix, so
  # the shadow arm's never-fixed tree is not re-counted at every step (smoke-4 I5).
  scorers: [correctness@1, code-quality@3, resource-usage@1, process-compliance@6, gate-effort@10]
  scorer_config:
    process-compliance@6:
      extra_test_patterns:
        - 'guardrail-check(?![\w.-])(?!\s+--(?:version|help)\b)'
  metric: scb-canonical@2

analysis:
  baseline_arm: r1-baseline
  # Pre-registered in rationale.md section 3; raw solve_rate is always reported beside it.
  primary_outcome: solve_rate_errata
  # Explore: at most 4 attempts per arm (user decision 2026-10-04). min_pairs stays at the default
  # (5), so paired verdicts read insufficient by design; the sample-size projection sizes a
  # later confirm run.
  attempts: 4
  seed: 20261004
  concurrency: 2
  max_exclusion_fraction: 0.2
  alpha: 0.05
  min_effects:
    correctness: 0.02
    headline_score: 2.0
  # r1's shadow gate never enforces, so it decides no checkpoint for this check: r2's share
  # alone decides it.
  manipulation_checks:
    - check: gate_clean_at_step_end
      min_share: 0.8
