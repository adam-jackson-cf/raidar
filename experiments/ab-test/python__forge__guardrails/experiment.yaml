# Guardrails A/B on forge: does a repository that refuses a commit until a mechanical
# Python guardrail gate passes change correctness and quality, against the shared framing alone?
# Explore iteration 3 (rationale.md section 12): the gate also runs the agent's OWN tests.
# r2 gets python-guardrails@3 (the @1 rule set and pins byte for byte, plus the tests check:
# unittest always, pytest for pytest-style tests, both under coverage; a Python change with no
# test that ran is refused, so are failing tests and owned line coverage below 85%), installed
# once per trial at environment start (root-owned under /opt/raidar-tools/python-guardrails,
# hash-pinned pytest 9.1.1 and coverage 7.16.2 beside Ruff and mypy; nothing in the agent
# image), with ruff.toml and mypy.ini copies in /app, and guardrail-gate@3 in commit mode (as
# @2, plus a snapshot of /app before each fix session, graded offline beside the step's final
# snapshot). r1 gets the same pack without the workspace copies and the same gate in shadow
# mode (recorded at each step's end outside /app, never enforced; its test run happens in a
# throwaway copy, so nothing reaches /app).
# Both arms share the starter framing and continue-on-stall@1: a session that changes nothing
# and ends asking a question gets one continuation (no human is available; proceed on the spec
# and reasonable assumptions recorded in ASSUMPTIONS.md), before the gate runs.
# No rules text tells the agent about the gate in advance (the mechanical rung only).
# Objective: explore (smallest runs: 1 trial per arm first, then at most 4 attempts per arm).
# Verdicts below min_pairs read insufficient by design.
# Pre-registration: rationale.md beside this file. Section 12 (iteration 3) pre-registers the
# hypothesis (enforcing the agent's own tests prevents fix-round regressions) and the secondary
# outcomes (gate.fix_round_correctness_delta, process.stall_rate, coverage, gate effort); the
# primary stays solve_rate_errata with raw solve_rate beside it.
# Validate: make experiment-validate EXPERIMENT=experiments/ab-test/python__forge__guardrails/experiment.yaml
# Lock:     make experiment-lock EXPERIMENT=experiments/ab-test/python__forge__guardrails/experiment.yaml
schema_version: 2
kind: ab-test
id: python__forge__guardrails
description: Does a commit gate enforcing the python-guardrails rule set change correctness and code quality on forge?

problems:
  # SCB Harbor dataset, pinned to scb-problems@38d627ecf668 (8 checkpoints); the lock pins
  # the forge errata (sha256 9a6dec369dea).
  - ref: scb/forge@38d627ecf668

runtime: python
environment:
  type: docker
  compose_init: true

agents:
  # Real-LLM policy: codex + gpt-6-luna at low effort.
  - id: codex-luna
    name: codex
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

factors: [condition]

# Both arms get the same framing (pilot v2): where to work, that /app may start empty,
# what to build, and that nobody answers questions; and the same stall continuation
# (continue-on-stall@1, a session wrapper: it runs inside the gate, before the gate runs).
shared_components:
  - use: prompt-wrapper@1
    files: [components/shared/starter-framing.md]
  - use: continue-on-stall@1

conditions:
  - id: r1-baseline
    components:
      # The same pack, installed outside /app at environment start, with nothing in the
      # workspace: the agent sees no ruff.toml or mypy.ini. Its probe proves at every step the
      # pinned tools, the install-time smoke and an unchanged tool tree, and at step 1 that no
      # config copy is in /app.
      - use: python-guardrails@3
        with:
          workspace_configs: false
      # The same commit check in shadow mode: run once at each step's end against a git
      # directory outside /app, its tests in a throwaway copy (the workspace is never
      # written), recorded with its git evidence, never enforced (no refusal, no fix session,
      # so no pre-fix snapshot).
      - use: guardrail-gate@3
        with:
          command: guardrail-check
          mode: shadow
          max_rounds: 3
          timeout_sec: 300
  - id: r2-guardrails
    components:
      # The pack: the gate entrypoint (the agent's own tests included), its pinned tools and
      # protected configs, and the workspace config copies. Its probe proves at every step
      # the pinned versions, the install-time smoke (a clean file with its test passes, an
      # unused import is refused) and an unchanged tool tree; its integrity flags record
      # config-copy edits, tree changes and hook-bypass attempts without failing the step.
      - use: python-guardrails@3
        with:
          workspace_configs: true
      # The repository's commit gate. The hook command is plain `guardrail-check`, as in a
      # real repository; the gate's JSON report (tests block included) goes to the run's
      # report dir, where gate-effort@4 reads it; every commit attempt records git evidence,
      # and /app is snapshotted before each fix session for the offline pre-fix grade.
      - use: guardrail-gate@3
        with:
          command: guardrail-check
          mode: commit
          max_rounds: 3
          timeout_sec: 300

arms:
  - id: r1-baseline
    condition: r1-baseline
    agent: codex-luna
  - id: r2-guardrails
    condition: r2-guardrails
    agent: codex-luna

assessment:
  # Iteration 3 (rationale.md section 12): gate-effort@4 is @3 plus the tests check
  # (first run and step end, owned coverage) and fix_round_correctness_delta (final minus
  # pre-fix case pass rate; make experiment-assess grades the pre-fix snapshots into the
  # store first); process-compliance@3 is @2 plus stall_rate (continue-on-stall@1 records).
  scorers: [correctness@1, code-quality@1, resource-usage@1, process-compliance@3, gate-effort@4]
  metric: scb-canonical@2

analysis:
  baseline_arm: r1-baseline
  # Pre-registered in rationale.md section 3; raw solve_rate is always reported beside it.
  primary_outcome: solve_rate_errata
  # Explore: at most 4 attempts per arm (user decision 2026-10-04). min_pairs stays at the default
  # (5), so paired verdicts read insufficient by design; the sample-size projection sizes a
  # later confirm run.
  attempts: 4
  seed: 20261004
  concurrency: 2
  max_exclusion_fraction: 0.2
  alpha: 0.05
  min_effects:
    correctness: 0.02
    headline_score: 2.0
  # r1's shadow gate never enforces, so it decides no checkpoint for this check: r2's share
  # alone decides it.
  manipulation_checks:
    - check: gate_clean_at_step_end
      min_share: 0.8
