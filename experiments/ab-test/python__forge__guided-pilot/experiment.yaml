# Phase 1 pilot (implementation-plan §3, 1.P): one validated 8-checkpoint problem
# (forge, verifier-validation in oracle-validation.md) x {baseline, guided} x 16 attempts,
# continue mode. v2: 16 attempts is the J2 solve_rate projection from the v1 pilot
# (gate packet §2.5). Formerly examples/pilot/experiment.yaml (id pilot-forge); jobs
# forge-02/forge-03 were migrated onto this file's lock with `make experiment-migrate-job`.
# Validate: make experiment-validate EXPERIMENT=experiments/ab-test/python__forge__guided-pilot/experiment.yaml
# Lock:     make experiment-lock EXPERIMENT=experiments/ab-test/python__forge__guided-pilot/experiment.yaml
schema_version: 2
kind: ab-test
id: python__forge__guided-pilot
description: Does the guided treatment (rules, skill, lint config, turn-end check, review loop) improve correctness and inertia on forge?

problems:
  # SCB Harbor dataset, pinned to scb-problems@38d627ecf668 (resolved by the WS-B registry).
  - ref: scb/forge@38d627ecf668

runtime: python
environment:
  type: docker
  compose_init: true

agents:
  # The pilot's single agent. Plan 1.P names Claude Code; by user directive (and
  # ADR-001 §2.7) every real-LLM trial uses codex + gpt-6-luna at low effort.
  - id: codex-luna
    name: codex
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

factors: [condition]

# Pilot v2 (gate packet "Pilot v2 treatment revisions"): framing both arms get,
# identically. In v1 the baseline often saw an empty /app, asked for the repository
# and wrote nothing (F1); the guided rules supplied the missing framing, which
# confounded the effect. The template adds only that framing: where to work, that
# /app may start empty, what to build, and that nobody answers questions.
shared_components:
  - use: prompt-wrapper@1
    files: [components/shared/starter-framing.md]

conditions:
  - id: baseline
    components: []
  # The guided treatment (design memo §10.4; plan C4): working rules, a skill,
  # lint config, a turn-end self-check and an implement -> review -> fix loop.
  - id: guided
    components:
      - use: rules-file@1
        files: [components/guided/AGENTS.md]
      - use: skills@1
        files: [components/guided/skills/checkpoint-discipline]
      - use: lint-config@1
        files: [components/guided/ruff.toml]
      # Codex maps stop-hook@1 to `notify`: it runs at each turn end, but its output
      # is not shown to the agent (a Claude Stop hook's would be). ruff/mypy are
      # scorer tools and are not in the agent image, so the check is a byte-compile.
      - use: stop-hook@1
        with:
          command: python3 -m compileall -q . >/dev/null 2>&1 || true
      # Reviewer sessions use the arm's own agent and are billed to the arm.
      # review-loop@2 reads feedback before or after the VERDICT line and re-asks
      # once on an unusable review (F3: @1 read 18/40 forge reviews as EMPTY_FEEDBACK).
      - use: review-loop@2
        with:
          max_review_rounds: 2

arms:
  - id: baseline
    condition: baseline
    agent: codex-luna
  - id: guided
    condition: guided
    agent: codex-luna

assessment:
  scorers: [correctness@1, code-quality@1, resource-usage@1, process-compliance@1]
  # scb-canonical@2: the fork's score plus zero_correctness (C = 0 -> S = 0 even when a
  # quality component is missing), so failed trials stay in the paired S analysis.
  metric: scb-canonical@2

analysis:
  baseline_arm: baseline
  attempts: 16
  seed: 20260929
  concurrency: 2
  # Verdict thresholds, pinned by the lock before any data is seen (memo §2.3).
  # raidar analyze reads them from the lock; a command-line override is labelled.
  min_pairs: 5
  max_exclusion_fraction: 0.2
  alpha: 0.05
  min_effects: {}
