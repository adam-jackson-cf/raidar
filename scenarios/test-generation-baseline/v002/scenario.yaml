name: test-generation-baseline
display_name: Pricing test authoring
scenario_revision: v002
parent_revision: v001
description: Baseline test-generation task with production-code guardrail
difficulty: medium
task_kind: test_authoring
delivery_mode: direct_implementation
workspace_state: existing
starting_conditions: []
languages:
- Python
evaluation_role: benchmark
catalog_status: calibration
variant_axes: {}
timeout_sec: 1800
test_scripts: []
environment:
  kind: stack_preset
  id: python:3.12
  capabilities:
    runtimes: {}
    package_managers: {}
    tools: {}
    browsers: {}
  workdir: /app
  requirements:
    runtimes:
      python: '>=3.12'
    package_managers: {}
    tools:
      coverage: '>=7'
    browsers: {}
  resources:
    cpus: 2
    memory_mb: 4096
    storage_mb: 10240
  allow_internet: true
starter:
  root: starter
verification:
  max_gate_failures: 3
  coverage_threshold: 0.8
  min_quality_score: 0.85
  required_commands:
  - - python
    - -m
    - compileall
    - -q
    - src
    - tests
  - - python
    - -m
    - coverage
    - run
    - --source=src
    - -m
    - unittest
    - discover
    - -s
    - tests
  - - python
    - -m
    - coverage
    - json
    - -o
    - .raidar/coverage.json
  setup_actions: []
  test_discovery_globs: []
  skip_test_commands_when_no_tests: false
  gates: []
  workflow:
    atomic_commits_required: false
requirements:
  items:
  - id: req-discount-tests
    description: Add focused tests for percentage, fixed, and invalid discounts.
    check:
      type: file_exists
      pattern: tests/test_discounts.py
      description: Discount test file exists.
    required_test_evidence: []
  - id: req-percentage-case
    description: Tests cover percentage discounts.
    check:
      type: import_present
      pattern: percentage
      description: Percentage discount test marker is present.
    required_test_evidence: []
  - id: req-invalid-case
    description: Tests cover invalid discount input.
    check:
      type: import_present
      pattern: assertRaises
      description: Invalid input assertion marker is present.
    required_test_evidence: []
scorers:
- id: test-generation
  version: 2
  weight: 0.78
  config: {}
- id: requirements
  version: 1
  weight: 0.2
  config: {}
- id: resource-efficiency
  version: 1
  weight: 0.02
  config: {}
prompt:
  entry: prompt/task.md
  includes: []
