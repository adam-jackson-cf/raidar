name: skill-benchmark-coding-test
scenario_revision: v002
description: Lint-stable TypeScript utility benchmark with explicit verification guidance
difficulty: medium
category: greenfield-code
timeout_sec: 1800
test_scripts: []
environment:
  kind: stack_preset
  id: node:20
  workdir: /app
  requirements:
    runtimes:
      node: '>=20'
    package_managers:
      bun: '>=1'
    tools:
      typescript: '>=5'
    browsers: {}
  resources:
    cpus: 2
    memory_mb: 4096
    storage_mb: 10240
  allow_internet: true
starter:
  root: starter
verification:
  max_gate_failures: 4
  coverage_threshold: 0.8
  min_quality_score: 0.85
  required_commands:
  - - bun
    - run
    - typecheck
  - - bun
    - run
    - lint
  - - bun
    - run
    - test
  - - bun
    - run
    - test:coverage
  setup_actions:
  - - bun
    - install
    - --frozen-lockfile
  test_discovery_globs:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.test.js'
  - '**/*.test.jsx'
  - '**/*.spec.js'
  - '**/*.spec.jsx'
  skip_test_commands_when_no_tests: true
  gates:
  - name: typecheck
    command:
    - bun
    - run
    - typecheck
    on_failure: continue
  - name: lint
    command:
    - bun
    - run
    - lint
    on_failure: continue
  - name: test
    command:
    - bun
    - run
    - test
    on_failure: continue
  - name: coverage
    command:
    - bun
    - run
    - test:coverage
    on_failure: continue
  workflow:
    atomic_commits_required: false
requirements:
  items:
  - id: req-math-module-created
    description: Creates the math utility module.
    check:
      type: file_exists
      pattern: src/lib/math.ts
      description: Creates the math utility module
    required_test_evidence: []
  - id: req-export-sum-even
    description: '`src/lib/math.ts` exports `sumEven(nums: number[]): number`.'
    check:
      type: import_present
      pattern: export function sumEven
      description: Named `sumEven` export exists
    required_test_evidence: []
  - id: req-integer-filter
    description: '`sumEven` includes only integer values when calculating the sum.'
    check:
      type: import_present
      pattern: Number.isInteger
      description: Integer filtering is explicit
    required_test_evidence: []
  - id: req-even-filter
    description: '`sumEven` includes only even values when calculating the sum.'
    check:
      type: import_present
      pattern: '% 2'
      description: Even-number filtering is explicit
    required_test_evidence: []
  - id: req-tests-created
    description: '`src/test/math.test.ts` covers the utility with deterministic Vitest
      cases.'
    check:
      type: file_exists
      pattern: src/test/math.test.ts
      description: Unit test file exists
    required_test_evidence: []
  - id: req-vitest-suite
    description: Uses a Vitest suite for the utility tests.
    check:
      type: import_present
      pattern: describe
      description: Uses a Vitest suite for the utility tests
    required_test_evidence: []
  - id: req-vitest-cases
    description: Uses deterministic Vitest cases.
    check:
      type: import_present
      pattern: it(
      description: Uses deterministic Vitest cases
    required_test_evidence: []
  - id: req-no-todo
    description: No TODO markers remain in production or test files.
    check:
      type: no_pattern
      pattern: TODO
      description: No TODO markers remain in production or test files
    required_test_evidence: []
scorers:
- id: typescript-code-task
  version: 1
  weight: 0.98
  config:
    artifact-checks:
      required_paths:
      - src/lib/math.ts
      - src/test/math.test.ts
      path_match: glob
- id: resource-efficiency
  version: 1
  weight: 0.02
prompt:
  entry: prompt/task.md
  includes: []
