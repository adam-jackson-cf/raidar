name: targeted-bugfix
display_name: Python shipping defect repair
scenario_revision: v002
parent_revision: v001
description: Calibration successor for targeted shipping defect repair with paired
  reproduction evidence, regression protection, and containment checks
difficulty: medium
task_kind: defect_repair
delivery_mode: direct_implementation
workspace_state: existing
starting_conditions:
- known_defect
languages:
- Python
evaluation_role: benchmark
catalog_status: calibration
variant_axes: {}
timeout_sec: 1800
test_scripts: []
environment:
  kind: stack_preset
  id: python:3.12
  capabilities:
    runtimes: {}
    package_managers: {}
    tools: {}
    browsers: {}
  workdir: /app
  requirements:
    runtimes:
      python: '>=3.12'
    package_managers: {}
    tools: {}
    browsers: {}
  resources:
    cpus: 2
    memory_mb: 4096
    storage_mb: 10240
  allow_internet: true
starter:
  root: starter
verification:
  max_gate_failures: 3
  coverage_threshold: 0.8
  min_quality_score: 0.85
  required_commands:
  - - python
    - -m
    - compileall
    - -q
    - src
    - tests
  - - python
    - -m
    - unittest
    - discover
    - -s
    - tests
  - - python
    - -m
    - unittest
    - tests.test_zone_three_expedited_reproduction
  setup_actions: []
  test_discovery_globs: []
  skip_test_commands_when_no_tests: false
  gates: []
  workflow:
    atomic_commits_required: false
requirements:
  items:
  - id: req-fix-zone-rate
    description: Zone 3 expedited shipments use the configured surcharge.
    check:
      type: import_present
      pattern: zone == 3
      description: Zone 3 expedited branch is present.
    required_test_evidence: []
  - id: req-regression-test
    description: Regression coverage asserts that a 2 kg expedited zone 3 shipment quotes 19.2.
    check:
      type: import_present
      pattern: assertEqual(shipping_quote(2, 3, expedited=True), 19.2)
      description: Regression test asserts the repaired expedited zone 3 quote.
    required_test_evidence: []
  - id: req-defect-evidence-retained
    description: Retain defect evidence that links the repaired behavior to a changed regression test.
    check:
      type: file_exists
      pattern: evidence/defect-evidence.json
      description: Defect evidence JSON exists in the completed workspace.
    required_test_evidence: []
  - id: req-no-api-change
    description: Preserve the `shipping_quote(weight_kg, zone, expedited=False)` API.
    check:
      type: import_present
      pattern: 'def shipping_quote(weight_kg, zone, expedited=False):'
      description: Public shipping_quote API remains present with its original signature.
    required_test_evidence: []
evidence:
  retained_files:
  - path: evidence/defect-evidence.json
    description: JSON defect evidence naming the changed regression test under regression_tests, test_evidence, or passing_tests.
scorers:
- id: bugfix
  version: 2
  weight: 0.78
  config: {}
- id: requirements
  version: 1
  weight: 0.2
  config: {}
- id: resource-efficiency
  version: 1
  weight: 0.02
  config: {}
prompt:
  entry: prompt/task.md
  includes: []
