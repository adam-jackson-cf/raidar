repos:
  - repo: local
    hooks:
      # Hooks export the invoking repository's locations; checks that create scratch
      # repositories must locate them from their own working directory instead.
      - id: repository-gate
        name: Repository commit gate (check only)
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_PREFIX make gate-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
