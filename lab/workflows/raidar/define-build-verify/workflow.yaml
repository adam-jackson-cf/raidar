# Define-build-verify: raidar/define, the build and raidar/verify in one primary session, with
# the host-side aspect judge. Released as raidar/define-build-verify@N in lab/releases.yaml.
# The define intake and the verify gate come from their packages (%%%DEFINE%%% and %%%VERIFY%%%
# are their prompt fragments); the build prompt, the reply shape and the judge settings below are
# the spike's define-build-verify@4, unchanged: every build turn ends with a JSON reply
# {account, ac_tests, adrs} (acceptance-reply/1); after each accepted seal the host judges every
# criterion of define.criteria (jev-judge/1; closure by thresholds, the dated Jev model id) and
# sends open criteria back as a rework turn, at most max_passes passes (3: the smoke's 1800 s
# holds a first build, a judge pass and two reworks, each rework started only when the time left
# fits it). The question set, retries, timeouts and context limits are jev-judge/1 constants.
schema: 2
name: define-build-verify
build:
  prompt: |-
    Build the issue below in the repository you are in, per the repository's own
    rules, and write the tests that prove it.

    %%%DEFINE%%%

    The feature definition (`/app/.raidar/feature-definition.md`) says what to build:
    features F1, F2, … with their acceptance criteria, and the decisions already made.
    Under each criterion:
    - `Source:` lines are the issue's statements it derives from: they are the
      requirement where the criterion's wording differs;
    - each `Aspect:` is a situation a test sets up and the outcome it asserts;
    - an `Example:` value must appear literally in a test mapped to the criterion;
    - a `Kind: regression` criterion has no aspects: map to it the repository's
      earlier tests that cover it, which passed before your change;
    - `Verification:` is the engine's line, the same for every criterion: a
      criterion is done only when tests mapped to it in `ac_tests` prove it.

    Keep behaviour earlier requirements accepted, and its tests, passing. Leave
    `/app/.raidar/` as it is.

    %%%VERIFY%%%

    Once the gate accepts your work, the engine checks each aspect of each
    criterion against its mapped tests, and every criterion still open comes back
    to you with what is missing. This session is yours for the whole run.

    Your reply says what you changed and why (`account`), maps every acceptance
    criterion to the tests that prove it (`ac_tests`) and reports your architecture
    decisions (`adrs`):
    - a test is named as the test runner names it (`path::test_name` or
      `path::Class::test_name`); the engine checks each test's file is in the
      working tree, and a test the gate does not collect counts as missing. On a
      later turn, list only the criteria whose tests you added, changed, moved or
      renamed, or none;
    - an ADR is an architecture decision the feature definition does not already
      record (a new component or module boundary, a data format, a dependency, a
      structural choice): `id` is `ADR1`, … numbered on across your turns and
      `status` is `accepted` or `superseded`; report each once, and again only when
      its status changes; none: `[]`.

    The issue:

    %%%TASK%%%
  reply: acceptance-reply/1
stages:
  - use: raidar/define@1
  - use: raidar/verify@1
gate:
  max_fix_rounds: 2
judge:
  criteria: define.criteria
  model: typesafe/jev-1.13-20260917
  closed_at: 0.8
  open_at: 0.3
  max_passes: 3
  rework: |-
    The engine's verification left the acceptance criteria below open, each with
    the issue statements it derives from, what is missing (an aspect no mapped test
    sets up and asserts, an `Example:` value no mapped test states, a mapped test
    that did not pass) and its mapped tests with their gate result. Fix every one
    in this turn, keep every criterion's tests mapped and passing, and do not break
    what already works. When you stop, the engine records the gate's verdict without
    changing your work and checks every criterion again.

    Reply as before: `account` says criterion by criterion (by id) what you changed;
    `ac_tests` lists only the criteria whose tests you added, changed, moved or
    renamed; `adrs` any new or changed decisions.

    The open acceptance criteria, by feature:

    %%%PUSHBACK%%%

    The gate's result on the work the engine checked:

    %%%GATE%%%
