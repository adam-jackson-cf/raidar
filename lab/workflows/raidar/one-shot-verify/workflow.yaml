# One-shot-verify: the one-shot build prompt plus the raidar/verify package (record-only seal, no
# fix turns). Released as raidar/one-shot-verify@N in lab/releases.yaml. The build prompt is FXL's
# [stage_prompts] implement; %%%VERIFY%%% is filled with the package's prompt fragment. The
# package's own parameters stay at their defaults (spike parity: test_timeout 60).
schema: 2
name: one-shot-verify
build:
  prompt: |-
    Work the issue below per the repository's own rules.

    %%%VERIFY%%%

    %%%TASK%%%
stages:
  - use: raidar/verify@1
gate:
  max_fix_rounds: 0
