# One-shot-verify: the one-shot build prompt with the verify stage (design section 5.3), spike-sized;
# released as one-shot-verify@N in lab/releases.yaml. Mechanics after factory-x-loops
# workflow/one-shot-verify/v1.toml: the agent commits through the gate as its pre-commit hook, the
# runner seals what is left after every turn, a refusal resumes the session with the gate's output
# at most max_fix_rounds times. The build prompt is FXL's [stage_prompts] implement; the verify
# prompt is FXL workflow/templates/verify/v1.md with its tokens renamed, and without what this
# spike's gate does not do (gate policies, idle limits, test workers, safe fixes and formatting
# applied first, retiring tests through a decisions file).
schema: 1
name: one-shot-verify
stages:
  build:
    prompt: |-
      Work the issue below per the repository's own rules.

      %%%VERIFY%%%

      %%%TASK%%%
  verify:
    enabled: true
    language: python
    prompt: |-
      ## Verification

      Your work is read from the repository's commits.

      Commit with `git commit` after each logical step, starting as soon as your
      first test passes. The repository's pre-commit hook is the verify gate: every
      commit runs it over the whole tree, so it checks your work as you go. A refused
      commit lists what to fix: fix that and commit again until it passes. Never skip
      the hook (`--no-verify`, `-n`), change git's hook settings, or run
      `git reset --hard`, `git clean` or `git restore`. Check `git status` and
      `git diff` before `git add -A`; use Conventional Commit messages
      (`feat|fix|refactor|test|docs|chore: <summary>`).

      Implementation work is not complete until a commit passes the gate. Do not end
      your turn while a commit is refused: a refused commit means the work is
      unfinished. When you stop, the process that runs you commits whatever is left
      through the same gate; a refusal comes back to you with the gate's output, at
      most %%%MAX_FIX_ROUNDS%%% times.

      The gate's rules are in `%%%RULES_FILE%%%` at the repository root: what blocks a
      commit and what only warns. It runs ruff, ruff's formatter check, strict mypy
      and your tests with pytest: at least one test must exist and none may fail, and
      a test that takes longer than %%%TEST_TIMEOUT_SECONDS%%% s fails. Keep each test
      fast, and independent of each other and of shared state. Declare every
      third-party package your production code imports in the project's dependency
      manifest. Keep data your code or tests write while running out of the commit:
      write it to a temporary or configured location, or have the project's
      `.gitignore` exclude it.
    gate: { on_commit: true, after_turn: true }
    max_fix_rounds: 2
    max_passes: 1
    test_timeout: 60
    rules_file: AGENTS.md
    checks:
      - { name: lint, category: lint, tool: ruff==0.8.6, run: "ruff check", blocking: true }
      - { name: format, category: format, tool: ruff==0.8.6, run: "ruff format --check", blocking: true }
      - { name: types, category: types, tool: mypy==2.3.1, run: "mypy --strict", blocking: true }
      - { name: tests, category: tests, tool: pytest==9.1.1, blocking: true }
