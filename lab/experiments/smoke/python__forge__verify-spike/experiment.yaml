# Verify-stage spike (split design S2): forge x one codex arm running one-shot-verify@1 (the
# build prompt plus the verify gate: hook, seal after every turn, at most 2 fix turns) x one
# attempt, to show the second stage's mechanics inside the checkpoint's one primary session and
# what they cost. Kind smoke, not citable.
# Run detached: make experiment-execute EXPERIMENT=lab/experiments/smoke/python__forge__verify-spike/experiment.yaml MAX_CHECKPOINTS=3 JOB_ID=<id> DETACH=1
schema_version: 3
kind: smoke
id: python__forge__verify-spike
description: Verify-stage spike on forge (one-shot-verify@1); not citable.

problems:
  - ref: scb/forge@38d627ecf668

runtime: python

agents:
  - id: agent
    release: codex@2
    model: gpt-6-luna
    reasoning: low

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

arms:
  - id: verify
    agent: agent
    workflow: one-shot-verify@1

assessment:
  scorers: [correctness@2, code-quality@4, resource-usage@2, process-compliance@7]
  metric: scb-canonical@2

analysis:
  baseline_arm: verify
  attempts: 1
  seed: 20261026
