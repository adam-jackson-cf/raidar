# Verify-stage spike: forge x one codex arm running one-shot-verify@3 (the
# build prompt plus the verify gate: hook and recording seal, no fix turns) x one
# attempt, to show the second stage's mechanics inside the checkpoint's one primary session and
# what they cost. Kind smoke, not citable.
# Run detached: make experiment-execute EXPERIMENT=lab/experiments/smoke/python__forge__verify-spike/experiment.yaml TARGET=mbp MAX_CHECKPOINTS=2 JOB_ID=<id> DETACH=1
schema_version: 3
kind: smoke
id: python__forge__verify-spike
description: Verify-stage spike on forge (one-shot-verify@3); not citable.

problems:
  - ref: scb/forge@38d627ecf668

runtime: python

agents:
  - id: agent
    release: codex@3
    model: gpt-6-luna
    reasoning: low

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

arms:
  - id: verify
    agent: agent
    workflow: one-shot-verify@3

assessment:
  scorers: [correctness@9, code-quality@8, resource-usage@7, process-compliance@11]
  metric: scb-canonical@2

analysis:
  baseline_arm: verify
  attempts: 1
  seed: 20261026
