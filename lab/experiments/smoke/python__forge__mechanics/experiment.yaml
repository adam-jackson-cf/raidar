# Mechanics declaration smoke (ADR-002, design r2 §5 step 7): the 8-checkpoint forge
# problem x one vanilla codex arm x one attempt, through the copy-only path on the
# configured Docker target, with run-health and liveness (observe) recorded.
# It proves the multi-checkpoint path end to end on the current run mechanics; kind smoke, not citable.
# Framing comes from the one-shot workflow's build prompt and the seeded workspace project:
# without framing vanilla codex saw an empty /app, asked a question and wrote nothing (pilot F1;
# observed again in the first mechanics smoke job).
# Run detached: make experiment-execute EXPERIMENT=lab/experiments/smoke/python__forge__mechanics/experiment.yaml JOB_ID=<id> DETACH=1
schema_version: 3
kind: smoke
id: python__forge__mechanics
description: Mechanics declaration smoke on forge (8 checkpoints); not citable.

problems:
  - ref: scb/forge@38d627ecf668

runtime: python

agents:
  - id: agent
    release: codex@2
    model: gpt-6-luna
    reasoning: low

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

arms:
  - id: baseline
    agent: agent
    workflow: one-shot@1

assessment:
  scorers: [correctness@6, code-quality@7, resource-usage@5, process-compliance@10]
  metric: scb-canonical@2

analysis:
  baseline_arm: baseline
  attempts: 1
  seed: 20261023
