# Agent benchmark: the one-shot problem once per released agent, every arm on one workflow
# (one-shot@1): the agent is what varies, and codex is the reference agent; analysis gives
# paired verdicts against it plus a ranking view. Today the only agent release is codex@2
# (lab/releases.yaml), so the benchmark has one arm; add an agent and an arm when another
# agent is released. One attempt is a smoke-sized benchmark: validate warns below 5 attempts.
# Formerly examples/smoke/agents.experiment.yaml (id smoke-agents).
schema_version: 3
kind: benchmark
id: python__circuit_eval-cp1__agents
description: Every released agent on the smoke problem; a smoke-sized benchmark.

problems:
  - ref: scb/circuit_eval.checkpoint_1@38d627ecf668

runtime: python

agents:
  - id: codex
    release: codex@2
    model: gpt-6-luna
    reasoning: low

protocol:
  agent_timeout_sec: 1800

arms:
  - id: codex
    agent: codex
    workflow: one-shot@1

assessment:
  scorers: [correctness@3]
  metric: scb-canonical-oneshot@1

analysis:
  baseline_arm: codex
  attempts: 1
  seed: 20260930
