[project]
name = "raidar-contract"
version = "1.0.0"
description = "Portable Raidar contract: stage/1, workflow schema 2, criteria/1, stage-tree/1, releases and the agent schema"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raidar_contract"]

[tool.hatch.build.targets.sdist]
include = ["src/raidar_contract", "pyproject.toml"]
