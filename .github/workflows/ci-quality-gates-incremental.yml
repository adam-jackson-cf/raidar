name: ci-quality-gates-incremental

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv>=0.7"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install repo dev dependencies
        run: |
          uv sync --project orchestrator --all-extras --frozen
          uv sync --project auto_researcher --extra dev --frozen

      - name: Run root quality gate
        run: make quality
