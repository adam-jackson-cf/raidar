name: ci-quality-gates-incremental

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # releases-check compares the register with main's history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          python-version: "3.13.7"

      - name: Install Python
        run: uv python install

      - name: Install orchestrator dev dependencies
        run: |
          uv sync --project orchestrator --all-extras --frozen --python 3.13.7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked formatter
        run: npm ci --ignore-scripts

      - name: Run repository CI gate
        run: make gate-ci
