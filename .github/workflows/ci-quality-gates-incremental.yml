name: ci-quality-gates-incremental

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # releases-check compares the register with main's history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          python-version: "3.13.7"

      - name: Install Python
        run: uv python install

      - name: Install orchestrator dev dependencies
        run: |
          env -u AGENT uv sync --project orchestrator --all-extras --frozen --python 3.13.7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked formatter
        run: npm ci --ignore-scripts

      # guardrails-reference lists the review-surface Playwright tests (TEST.tier-selectors).
      - name: Install locked review-surface test runner
        run: npm ci --ignore-scripts --prefix review-surface

      # guardrails-reference runs lever-selftest (SURFACE.lever-isolation): the lever's doctor
      # serves review-surface/dist and renders it in headless Chromium. The gate sets
      # XDG_CACHE_HOME to the repository's .cache (Makefile REPO_CACHE_DIR), where Playwright
      # looks for its browsers on Linux, so Chromium is installed there.
      - name: Build review surface and install Chromium for the lever
        run: |
          npm run build --prefix review-surface
          cd review-surface && XDG_CACHE_HOME="$GITHUB_WORKSPACE/.cache" npx --no-install playwright install --with-deps chromium

      - name: Run repository CI gate
        run: env -u AGENT uv run --project orchestrator --extra dev python scripts/checks/run-repository-gate.py ci
