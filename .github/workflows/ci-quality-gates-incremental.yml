name: ci-quality-gates-incremental

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # releases-check compares the register with main's history

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          python-version: "3.13.7"

      - name: Install Python
        run: uv python install

      - name: Install orchestrator dev dependencies
        run: |
          env -u AGENT uv sync --project orchestrator --all-extras --frozen --python 3.13.7

      - name: Run root quality gate
        run: env -u AGENT make quality

      - name: Run slow tier
        if: github.event_name == 'push'
        run: env -u AGENT make test-slow

      - name: Run quality tier
        if: github.event_name == 'push'
        run: env -u AGENT make test-quality
