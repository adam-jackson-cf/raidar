name: perf-fixture

# N1 overhead gate (reboot plan D4): the no-LLM fixture experiment run through
# real Harbor trials, then `raidar perf check` against the accepted budgets.
# `make perf-fixture` builds the Python pack image when absent and fails (never
# skips) when Docker or the image is unavailable.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - "orchestrator/src/raidar/execution/**"
      - "orchestrator/src/raidar/oracle/**"
      - "orchestrator/src/raidar/components/**"
      - "orchestrator/src/raidar/packs/**"
      - "orchestrator/tests/test_execution_perf_fixture.py"
      - "orchestrator/tests/execution_support.py"
      - "orchestrator/uv.lock"
      - ".github/workflows/perf-fixture.yml"

jobs:
  perf-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKER_CONTEXT: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv>=0.7"

      - name: Install orchestrator dev dependencies
        run: |
          uv sync --project orchestrator --all-extras --frozen

      - name: Run the N1 fixture experiment and perf check
        run: make perf-fixture PERF_FIXTURE_DIR=perf-fixture-out

      - name: Upload fixture run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-fixture-run
          path: perf-fixture-out/runs
          if-no-files-found: ignore
