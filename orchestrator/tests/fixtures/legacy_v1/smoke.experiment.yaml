# Operational smoke (make orchestrator-smoke / make agent-smoke): one validated one-shot
# problem x one arm x one block, graded by the host-only oracle, correctness only.
# It proves the experiment path end to end (lock -> Harbor trial -> oracle -> run.json);
# it is not a benchmark and has no comparison. The smoke targets relock it under .tmp/
# with their overrides (agent, blocks, timeout), so this file stays the default.
# Validate: make experiment-validate EXPERIMENT=examples/smoke/experiment.yaml
schema_version: 1
id: smoke
description: Operational smoke of the experiment path; not a benchmark.

problems:
  # The pilot's one-shot problem (validated, see problems/registry/scb/).
  - ref: scb/circuit_eval.checkpoint_1@38d627ecf668

agents:
  # Real-LLM smokes default to codex-cli + gpt-6-luna at low effort (ADR-001 §2.7).
  - id: agent
    harness: codex-cli
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1

protocol:
  agent_timeout_sec: 1800

conditions:
  - id: baseline
    components: []

arms:
  - id: baseline
    condition: baseline
    agent: agent

assessment:
  scorers: [correctness@1]
  headline_policy: scb-canonical-oneshot@1

analysis:
  baseline_arm: baseline
  blocks: 1
  seed: 20260930
