[project]
name = "raidar"
version = "1.0.1"
description = "Agentic evaluation system orchestrator for testing model/harness combinations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # PEP 508/440 parsing of the requirements a graded submission declares (FCR-007).
    "packaging>=24.0",
    # Match the problems' resolver: uv@0.10.0 pins.
    "uv==0.10.0",
    "click>=8.0",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.13.5",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    # Harbor is exact-pinned (reboot plan task 0.2); upgrade only via a spike that
    # reruns the Phase 0 checks.
    "harbor==0.23.0",
    # LiteLLM is a transitive Harbor dependency; AGENTS.md requires an exact,
    # known-safe pin (never 1.82.7 or 1.82.8).
    "litellm==1.102.2",
    "jsonschema>=4.0",
    # The portable contract (one implementation: a path dependency, never published from here).
    "raidar-contract==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "lizard>=1.17.10",
    "mypy>=1.11",
    "pip-audit==2.9.0",
    "import-linter>=2.0",
    # code-quality@1 tool-env modules are imported in-process by the tests. These
    # pins equal the Python pack tool lock's scb-python-quality entry (a test
    # enforces it); production measurement uses the lazily provisioned tool env.
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.13.0",
    "networkx==3.6.1",
    "radon==6.0.1",
]

[project.scripts]
raidar = "raidar.cli:main"

# Registry resolvers loaded lazily by `raidar lock` (raidar.contract.references).
[project.entry-points."raidar.contract.resolvers"]
problem = "raidar.design.problem.resolver:resolver_factory"
scorer = "raidar.scoring.catalog.builtin:scorer_resolver"

[tool.uv]
required-version = ">=0.10.0"

[tool.uv.sources]
raidar-contract = { path = "../contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raidar"]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
preview = true
respect-gitignore = true
output-format = "full"
exclude = [
    ".build", ".git", ".tox", ".venv", "venv", "__pycache__", "*.egg-info",
    "build", "dist", "node_modules", ".pytest_cache", ".mypy_cache", ".ruff_cache",
]
# The define package's tool unit tests import its source in place (a test-only path).
src = [".", "src", "../lab/stages/raidar/define/tool/src"]
extend-exclude = [
    "../lab/experiments",
    "../var",
    "**/node_modules",
    "**/*.tsbuildinfo",
    "**/*.lock",
]

[tool.ruff.lint]
select = [
    "W", "D", "N", "PLR0904", "PLR0913", "PLR0914", "PLR0917",
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "C90",
    "PERF",
    "PT",
    "PGH",
    "A",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
preview = true
# E501 deliberately stays enabled; approved descriptive-summary exception: D401.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D401"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"**/tests/**" = ["D", "S101", "PLR2004"]
"test_*.py" = ["D", "S101", "PLR2004"]
"**/__init__.py" = ["F401", "D104"]
"conftest.py" = ["D"]
"setup.py" = ["D"]
# Canary fixture generator: each fixture is one literal source text, kept on one line.
"tests/fixtures/python_guardrails/make_fixtures.py" = ["E501", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["raidar", "raidar_contract", "define_tool", "verify_tool"]
split-on-trailing-comma = true

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-positional-args = 5
max-public-methods = 20
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
preview = false
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --ignore-glob=.env* --ignore-glob=**/.env*"
testpaths = ["tests"]
pythonpath = ["../lab/stages/raidar/define/tool/src"]
# Tiers are applied at file level only (pytestmark); see .agents/skills/test-patterns.
markers = [
    "slow: real processes or I/O beyond the fast tier's budget",
    "quality: repository-wide quality and guardrail checks",
    "docker: needs a Docker target",
    "security: security checks (overlays docker)",
    "perf: performance budgets (overlays docker)",
]

[tool.coverage.run]
branch = true

# Display only: pass/fail is the integer-count comparison against the floors below.
[tool.coverage.report]
precision = 2

# Coverage floors in percent: the one source of truth read by `raidar quality`.
# Integrated fast-only measurement after the test-suite refactor, floored to hundredths.
# Ratchet each floor up after every accepted change; never lower it.
[tool.raidar.coverage]
line_floor = 99.43
branch_floor = 98.72

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = [
    "src",
    "tests",
    "../contract/src",
    "../scripts",
    "../lab/stages/raidar/define/tool/src",
    "../lab/stages/raidar/verify/tool/src",
]
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/src",
    "$MYPY_CONFIG_FILE_DIR",
    "$MYPY_CONFIG_FILE_DIR/../scripts",
    "$MYPY_CONFIG_FILE_DIR/../contract/src",
    "$MYPY_CONFIG_FILE_DIR/../lab/stages/raidar/define/tool/src",
    "$MYPY_CONFIG_FILE_DIR/../lab/stages/raidar/verify/tool/src",
]
explicit_package_bases = true
# Fixture programs are tool inputs, not maintained importable Python.
exclude = '(^|/)fixtures/'

[[tool.mypy.overrides]]
# Mypy reports missing stubs; types-PyYAML/types-jsonschema/types-networkx are not dependencies.
module = ["yaml", "jsonschema", "networkx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Mypy reports these installed Harbor/Radon modules have neither stubs nor py.typed markers.
module = [
    "harbor.agents.base",
    "harbor.agents.factory",
    "harbor.agents.installed.base",
    "harbor.agents.installed.claude_code",
    "harbor.agents.installed.codex",
    "harbor.agents.options",
    "harbor.constants",
    "harbor.environments.base",
    "harbor.environments.capabilities",
    "harbor.environments.definition",
    "harbor.environments.docker",
    "harbor.environments.docker.docker",
    "harbor.models.agent.context",
    "harbor.models.agent.name",
    "harbor.models.task.config",
    "harbor.models.task.task",
    "harbor.models.trajectories",
    "harbor.models.trial.config",
    "harbor.models.trial.paths",
    "harbor.models.verifier.result",
    "harbor.trial.hooks",
    "harbor.trial.multi_step",
    "harbor.trial.network_policy",
    "harbor.trial.trial",
    "harbor.verifier.base",
    "radon",
    "radon.metrics",
    "radon.raw",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# follow_imports=skip makes pytest.fixture/mark decorators Any in the maintained test namespace.
module = ["tests", "tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# follow_imports=skip makes click command/group/option decorators (and aliases) Any here.
module = [
    "raidar.cli",
    "raidar.cli.agent",
    "raidar.cli.analyze",
    "raidar.cli.assess",
    "raidar.cli.env_harbor",
    "raidar.cli.execution",
    "raidar.cli.experiment_init",
    "raidar.cli.experiment_spec",
    "raidar.cli.health",
    "raidar.cli.imports",
    "raidar.cli.jev",
    "raidar.cli.jev_calibration",
    "raidar.cli.ledger",
    "raidar.cli.pack",
    "raidar.cli.perf",
    "raidar.cli.problem",
    "raidar.cli.quality",
    "raidar.cli.releases",
    "raidar.cli.stage",
    "raidar.cli.stage_fixtures",
    "raidar.cli.stage_package",
    "raidar.cli.target",
    "raidar.cli.workflow_new",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# follow_imports=skip makes pydantic field/model validators and serializers Any in these models.
module = [
    "raidar_contract.criteria",
    "raidar_contract.package.manifest",
    "raidar_contract.workflow",
    "raidar.design.experiment.schema",
    "raidar.design.problem.errata",
    "raidar.design.problem.models",
    "raidar.engine.target.config",
    "raidar.evaluation.analysis.outcomes",
    "raidar.evaluation.ledger.records",
    "raidar.evaluation.review.quality.models",
    "raidar.grading.bundle",
    "raidar.scoring.code_quality.lineage_models",
    "raidar.scoring.code_quality.models",
    "raidar.scoring.framework.manifest",
    "raidar.scoring.framework.result",
    "raidar.scoring.framework.store",
    "raidar.scoring.judge.audit",
    "raidar.scoring.judge.label_export",
    "raidar.scoring.judge.ledger",
    "raidar.scoring.judge.policies",
    "raidar.scoring.process_checks.assess",
    "raidar.subject.agent.schema",
    "raidar.subject.environment.python.pack_definition",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# follow_imports=skip makes pytest.hookimpl Any in these two runtime hook modules.
module = ["raidar.grading.runtime.raidar_oracle_plugin", "raidar.subject.primitive.gate_tool"]
disallow_untyped_decorators = false
