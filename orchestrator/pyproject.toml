[project]
name = "raidar"
version = "1.0.0"
description = "Agentic evaluation system orchestrator for testing model/harness combinations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # PEP 508/440 parsing of the requirements a graded submission declares (FCR-007).
    "packaging>=24.0",
    "click>=8.0",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.13.5",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    # Harbor is exact-pinned (reboot plan task 0.2); upgrade only via a spike that
    # reruns the Phase 0 checks.
    "harbor==0.23.0",
    # LiteLLM is a transitive Harbor dependency; AGENTS.md requires an exact,
    # known-safe pin (never 1.82.7 or 1.82.8).
    "litellm==1.102.1",
    "jsonschema>=4.0",
    # The portable contract (one implementation: a path dependency, never published from here).
    "raidar-contract==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "lizard>=1.17.10",
    "mypy>=1.11",
    "import-linter>=2.0",
    # code-quality@1 tool-env modules are imported in-process by the tests. These
    # pins equal the Python pack tool lock's scb-python-quality entry (a test
    # enforces it); production measurement uses the lazily provisioned tool env.
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.13.0",
    "networkx==3.6.1",
    "radon==6.0.1",
]

[project.scripts]
raidar = "raidar.cli:main"

# Registry resolvers loaded lazily by `raidar lock` (raidar.contract.references).
[project.entry-points."raidar.contract.resolvers"]
problem = "raidar.design.problem.resolver:resolver_factory"
scorer = "raidar.scoring.catalog.builtin:scorer_resolver"

[tool.uv.sources]
raidar-contract = { path = "../contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raidar"]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The define package's tool unit tests import its source in place (a test-only path).
src = [".", "src", "../lab/stages/raidar/define/tool/src"]
extend-exclude = [
    "../lab/experiments",
    "../var",
    "**/node_modules",
    "**/*.tsbuildinfo",
    "**/*.lock",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "C90",
    "PERF",
    "PT",
    "PGH",
    "A",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"**/__init__.py" = ["F401"]
# Canary fixture generator: each fixture is one literal source text, kept on one line.
"tests/fixtures/python_guardrails/make_fixtures.py" = ["E501", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --ignore-glob=.env* --ignore-glob=**/.env*"
testpaths = ["tests"]
pythonpath = ["../lab/stages/raidar/define/tool/src"]
# Tiers are applied at file level only (pytestmark); see .agents/skills/test-patterns.
markers = [
    "slow: real processes or I/O beyond the fast tier's budget",
    "quality: repository-wide quality and guardrail checks",
    "docker: needs a Docker target",
    "security: security checks (overlays docker)",
    "perf: performance budgets (overlays docker)",
]

[tool.coverage.run]
branch = true

# Display only: pass/fail is the integer-count comparison against the floors below.
[tool.coverage.report]
precision = 2

# Coverage floors in percent: the one source of truth read by `raidar quality`.
# Integrated fast-only measurement after the test-suite refactor, floored to hundredths.
# Ratchet each floor up after every accepted change; never lower it.
[tool.raidar.coverage]
line_floor = 99.43
branch_floor = 98.72

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
mypy_path = ["../lab/stages/raidar/define/tool/src"]
# PyYAML ships no type information and types-PyYAML is not a dependency: its API is Any.
disable_error_code = ["import-untyped"]
