# python-guardrails@1 tiers. Longest matching code prefix wins. block = refuses the
# commit; warn = reported in the gate output and JSON report, never refuses; off = not
# reported. Every code not listed blocks, including every mypy strict error code.
default = "block"
block = []
# Style or layout preferences with low defect signal, or environment-dependent checks.
warn = [
    "D",                    # numpy docstring style: only polices docstrings that were written
    "PT",                   # pytest style
    "PYQ102",               # tests/<group>/ layout convention
    "PARITY.lock-version",  # uv.lock parity: depends on the uv version and offline cache
]
# Conflicts with the runtime: the image has no pytest, unittest is the test runner.
off = [
    "PT009",  # unittest-style assertions
    "PT027",  # unittest assertRaises
]
