[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
follow_imports = skip
mypy_path = .
explicit_package_bases = True
show_error_codes = True
exclude = (^|/)(\.venv|venv|\.tox|\.nox|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache|\.git|node_modules|target|dist|build)/
disable_error_code = import-untyped
