id: plan-to-code
version: 1
status: proposed
category: quality
description: Scores implementation against an approved plan, including plan quality and implementation drift.
metrics:
  - id: plan-quality
    type: llm-as-judge
    weight: 0.35
    config:
      judge: judges/plan-judge.toml
  - id: acceptance
    type: core
    weight: 0.15
  - id: requirements-coverage
    type: core
    weight: 0.15
  - id: functional
    type: core
    weight: 0.15
  - id: verification-stability
    type: core
    weight: 0.10
  - id: artifact-checks
    type: artifact-checks
    weight: 0.10
    config:
      required_paths:
        - src/**
      path_match: glob
