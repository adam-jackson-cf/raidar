Fields used |\n|---|---|\n| `experiment-summary.json` | `experiment_id`, `config.{scenario_name, scenario_revision, harness, model, repeats}`, `synthetic`, `aggregate`, `sample`, `rerun`, `findings`, `created_at_utc` |\n\n## Per-run\n\n| File | Fields used |\n|---|---|\n| `runs/<run_id>/run.json` | `id`, `timestamp`, `duration_sec`, `config.model`, `traces[]`, `gate_history[]`, `scores.*` (`composite_score`, `quality_score`, `diagnostic_score`, `execution_validity.checks`, `functional.passed`, `requirements_coverage`, `resource_efficiency`, `metadata.{process, harbor, evidence}`, `scorer_results`, `metric_scores`, `unscored`, `unscored_reasons`) |\n| `runs/<run_id>/findings.json` *(optional)* | `findings[]`: `id`, `kind`, `category`, `title`, `detail`, `evidence[]` |\n| `runs/<run_id>/workspace-diff.json` *(optional)* | stored whole as an evidence artifact snapshot |\n\n## Per-scenario (for revision diffing)\n\n| File | Fields used |\n|---|---|\n| `scenarios/<name>/<revision>/scenario.yaml` | `description`, `difficulty`, `category`, `timeout_sec`; scorer profile, gate names, requirement ids (for change classification) |\n| `scenarios/<name>/<revision>/prompt/task.md` | full text, for line-level prompt diffs |\n\nThese feed the [projections](./projections.md) and ultimately the\n[verdict semantics](../concepts/verdict-semantics.md).\n","outlinks":["data/projections.md","concepts/verdict-semantics.md"],"inlinks":["data/index.md","data/owned-data.md","index.md"]},{"id":"concepts/index.md","dir":"concepts","meta":{"type":"Concept Index","title":"Concepts","description":"The semantic verdict vocabulary that translates raw Raidar scores, samples, and finding categories into one consistent good/bad language.","tags":["concepts","verdict","semantics"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Concepts\n\nThe surface's defining design move is a **semantic translation layer**\n([`src/utils/verdict.ts`](../../../review-surface/src/utils/verdict.ts)): raw\nscores, sample sizes, and finding categories become one consistent vocabulary so\nevery persona reads the same words for the same things.\n\n| Concept | Translates |\n|---|---|\n| [Verdict semantics](./verdict-semantics.md) | The overall layer and why it exists |\n| [Delivery tiers](./delivery-tiers.md) | composite score → Strong / Solid / Shaky / Failing |\n| [Repeatability](./repeatability.md) | score stddev → Consistent / Volatile |\n| [Sample confidence](./sample-confidence.md) | sample adequacy → Low / Fair / High confidence |\n| [Finding categories](./finding-categories.md) | raw Raidar category ids → plain-language labels |\n","outlinks":["concepts/verdict-semantics.md","concepts/delivery-tiers.md","concepts/repeatability.md","concepts/sample-confidence.md","concepts/finding-categories.md"],"inlinks":["index.md"]},{"id":"concepts/delivery-tiers.md","dir":"concepts","meta":{"type":"Concept","title":"Delivery tiers","description":"The composite-score verdict bands — Strong / Solid / Shaky / Failing / Unscored — shared by every score rendering.","resource":"../../../review-surface/src/utils/verdict.ts","tags":["concept","verdict","scoring"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Delivery tiers\n\n`scoreTier(score)` maps a composite score to one band, used by every score\nrendering on the surface ([Verdict](../components/verdict.md)).\n\n| Tier | Composite | Blurb | Colour |\n|---|---|---|---|\n| **Strong** | ≥ 0.90 | Delivered to spec | green |\n| **Solid** | ≥ 0.75 | Delivered with minor gaps | cyan |\n| **Shaky** | ≥ 0.50 | Delivered with significant gaps | orange |\n| **Failing** | < 0.50 | Did not deliver | red |\n| **Unscored** | `null` | No score recorded — run needs a rerun | grey |\n\n**Caveat (by design).** These are a **presentation band, not a canonical Raidar\ngrade** — Raidar deliberately has no composite grade. The Δ-vs-best column,\n[repeatability](./repeatability.md), and [confidence](./sample-confidence.md)\nexist to keep a bare tier from being over-trusted. See\n[verdict semantics](./verdict-semantics.md).\n","outlinks":["components/verdict.md","concepts/repeatability.md","concepts/sample-confidence.md","concepts/verdict-semantics.md"],"inlinks":["components/group-headline.md","components/run-pill.md","components/verdict.md","concepts/index.md","concepts/verdict-semantics.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"concepts/finding-categories.md","dir":"concepts","meta":{"type":"Concept","title":"Finding categories","description":"The taxonomy of Raidar finding categories and the plain-language labels the surface gives them (raw id kept in tooltips).","resource":"../../../review-surface/src/utils/verdict.ts","tags":["concept","findings","taxonomy"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Finding categories\n\nRaidar emits findings tagged with infra category ids. `CATEGORY_INFO` maps each\nto a plain-language label + hint; the raw id stays in the tooltip. These drive\n[annotation cards](../components/annotation-cards.md),\n[failure patterns](../components/failure-patterns.md), and the Issues column.\n\n| Category id | Label | Hint |\n|---|---|---|\n| `failed-gate` | Verification gate failed | A required check (tests, lint, …) did not pass |\n| `missing-required-command` | Required step never ran | Scenario expects a command the agent never executed |\n| `requirements-gap` | Requirement not satisfied | One or more scenario requirements unmet |\n| `requirements-satisfied` | All requirements satisfied | Every scenario requirement met |\n| `missing-artifact` | Evidence file missing | A declared evidence artifact is absent/unusable |\n| `retained-evidence` | Evidence retained | Declared artifacts kept and usable |\n| `deterministic-cap` | Score capped by failed checks | Deterministic prerequisites failed, capping the metric |\n| `judge-review` | Judge verdict needs review | LLM-judge score disagrees with deterministic evidence |\n| `completion-claim` | Claimed done without proof | Agent reported success evidence doesn't support |\n| `performance-gate` | Performance threshold missed | Run breached a performance limit |\n| `workflow-anomaly` | Unusual workflow | Delivery deviated from the expected pattern |\n| `resource-outlier` | Unusual resource use | Tokens/duration far from scenario norm |\n| `repeat-variance` | Inconsistent across repeats | Repeat runs disagree more than expected (see [repeatability](./repeatability.md)) |\n| `unscored-run` | Run could not be scored | Scoring failed — needs a rerun |\n| `rerun-target` | Rerun required | Experiment has unresolved unscored runs |\n| `sample-adequacy` | Sample too small | Not enough scored runs to trust the aggregate (see [confidence](./sample-confidence.md)) |\n| `clean-verification` | Verification clean first try | All gates passed without retries |\n\nEach finding also carries `evidence[]` (`source`, `reference`, `detail`) that\nthe projection resolves to a span, enabling the \"jump:\" deep-links.\n","outlinks":["components/annotation-cards.md","components/failure-patterns.md","concepts/repeatability.md","concepts/sample-confidence.md"],"inlinks":["components/annotation-cards.md","components/experiment-expansion.md","components/failure-patterns.md","concepts/index.md","concepts/repeatability.md","concepts/verdict-semantics.md"]},{"id":"concepts/repeatability.md","dir":"concepts","meta":{"type":"Concept","title":"Repeatability","description":"The spread-of-results verdict — Consistent vs Volatile — derived from composite-score stddev against Raidar's repeat-variance threshold.","resource":"../../../review-surface/src/utils/verdict.ts","tags":["concept","verdict","variance"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Repeatability\n\n`spreadTier(statBlock)` turns a composite-score `stddev` into a verdict.\n\n| Tier | Condition | Meaning |\n|---|---|---|\n| **Consistent** | stddev < 0.10 | Repeats stay within ±0.1 — no variance flag |\n| **Volatile** | stddev ≥ 0.10 | Repeats disagree enough for Raidar to flag variance — inspect the outliers |\n\nThe 0.10 boundary is **not arbitrary**: it is Raidar's\n`REPEAT_VARIANCE_STDDEV_THRESHOLD`. At or above it Raidar raises a\n[`repeat-variance`](./finding-categories.md) finding, so \"Volatile\" on the\nsurface means precisely \"Raidar would flag this.\" Surfaced in the Repeatability\ncolumn of the [Experiments table](../pages/experiments.md).\n","outlinks":["concepts/finding-categories.md","pages/experiments.md"],"inlinks":["concepts/delivery-tiers.md","concepts/finding-categories.md","concepts/index.md","concepts/verdict-semantics.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"concepts/sample-confidence.md","dir":"concepts","meta":{"type":"Concept","title":"Sample confidence","description":"The trust verdict on an aggregate — Low / Fair / High confidence — from Raidar's sample-adequacy flags.","resource":"../../../review-surface/src/utils/verdict.ts","tags":["concept","verdict","sample"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Sample confidence\n\n`sampleTrust(sample, scored, total)` answers \"can I trust this aggregate at\nall?\" from the scenario's sample-adequacy flags.\n\n| Tier | Condition | Meaning |\n|---|---|---|\n| **Low confidence** | `minimum_met === false` | Below the minimum sample — treat results as directional only |\n| **Fair confidence** | minimum met, preferred not | Minimum met, below preferred |\n| **High confidence** | `preferred_met` | Preferred sample size met |\n\nShown in the Confidence column of the [Experiments table](../pages/experiments.md),\nalongside an \"N unscored\" caution when runs still need a rerun. The underlying\nflags are set by Raidar and [preserved unchanged](../data/projections.md) through\nthe projection.\n","outlinks":["pages/experiments.md","data/projections.md"],"inlinks":["concepts/delivery-tiers.md","concepts/finding-categories.md","concepts/index.md","concepts/verdict-semantics.md","data/projections.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"concepts/verdict-semantics.md","dir":"concepts","meta":{"type":"Concept","title":"Verdict semantics","description":"The translation layer that turns raw Raidar numbers and category ids into one consistent plain-language good/bad vocabulary shared by every surface.","resource":"../../../review-surface/src/utils/verdict.ts","tags":["concept","verdict","semantics","design-principle"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Verdict semantics\n\n**Why it exists.** Raidar's artifacts are precise but raw — a composite of\n0.82, a stddev of 0.13, a category `deterministic-cap`. Reviewers need a verdict,\nnot arithmetic. `verdict.ts` is the single place those raw values become\nwords, so the Experiments table, run header, run pills, and scorecard all speak\nthe same language.\n\n**The four translations.**\n\n1. [Delivery tiers](./delivery-tiers.md) — composite → Strong / Solid / Shaky / Failing.\n2. [Repeatability](./repeatability.md) — stddev vs Raidar's variance threshold → Consistent / Volatile.\n3. [Sample confidence](./sample-confidence.md) — adequacy flags → Low / Fair / High.\n4. [Finding categories](./finding-categories.md) — infra ids → readable labels (raw id kept in tooltips).\n\n**Helpers in the same module.** `humanize` (kebab/snake → sentence case),\n`scorerName`, `runLabel` (`…-low-04` → \"Run 04\"), and `runSummary` (the\none-sentence run outcome used by the [run header](../components/run-header.md)).\n\n**The honesty rule.** Translation never invents authority. Delivery tiers are an\nexplicit *presentation band* — \"Raidar has no canonical composite grade\" — and\nRepeatability is pinned to Raidar's real `REPEAT_VARIANCE_STDDEV_THRESHOLD` so\n\"Volatile\" means exactly \"Raidar would raise a variance finding.\" The raw values\nremain one tooltip or one disclosure away everywhere.\n","outlinks":["concepts/delivery-tiers.md","concepts/repeatability.md","concepts/sample-confidence.md","concepts/finding-categories.md","components/run-header.md"],"inlinks":["components/index.md","components/verdict.md","concepts/delivery-tiers.md","concepts/index.md","data/source-artifacts.md","index.md"]}],"sections":[".","personas","journeys","pages","components","data","concepts"],"labels":{".":"Overview","personas":"Personas","journeys":"Journeys","pages":"Pages","components":"Components","data":"Data lineage","concepts":"Concepts"}}</script>
<script>
const KB = JSON.parse(document.getElementById('kb').textContent);
const byId = new Map(KB.docs.map(d => [d.id, d]));

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inline(s, dir){
  // links first (capture before escaping mangles), via placeholders
  const tokens = [];
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
    const i = tokens.length; tokens.push({text, href}); return '\u0000'+i+'\u0001';
  });
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (_, c)=>'<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\u0000(\d+)\u0001/g, (_, i) => {
    const {text, href} = tokens[+i];
    const norm = resolve(dir, href);
    if (byId.has(norm)) return '<a href="#'+encodeURIComponent(norm)+'">'+esc(text)+'</a>';
    if (/^https?:/.test(href)) return '<a class="x" target="_blank" rel="noopener" href="'+href+'">'+esc(text)+'</a>';
    return '<a class="x" href="'+href+'">'+esc(text)+'</a>';
  });
  return s;
}
function resolve(dir, href){
  const clean = href.split('#')[0];
  let base = (dir==='.'?'':dir).split('/').filter(Boolean);
  if (clean.startsWith('/')) base = [];
  for (const part of clean.split('/')){
    if (part===''||part==='.') continue;
    if (part==='..') base.pop(); else base.push(part);
  }
  return base.join('/');
}

function render(body, dir){
  const lines = body.split('\n');
  let html = '', i = 0;
  while (i < lines.length){
    let line = lines[i];
    if (/^```/.test(line)){
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    let h = line.match(/^(#{1,6})\s+(.*)/);
    if (h){ const n=h[1].length; html += '<h'+n+'>'+inline(h[2],dir)+'</h'+n+'>'; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head = splitRow(line);
      i += 2; const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(splitRow(lines[i++]));
      html += '<table><thead><tr>'+head.map(c=>'<th>'+inline(c,dir)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c,dir)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*[-*]\s+/,''));
      html += '<ul>'+buf.map(b=>'<li>'+inline(b,dir)+'</li>').join('')+'</ul>'; continue;
    }
    if (/^\s*\d+\.\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*\d+\.\s+/,''));
      html += '<ol>'+buf.map(b=>'<li>'+inline(b,dir)+'</li>').join('')+'</ol>'; continue;
    }
    if (/^>\s?/.test(line)){
      const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      html += '<blockquote>'+inline(buf.join(' '),dir)+'</blockquote>'; continue;
    }
    if (/^---+\s*$/.test(line)){ html+='<hr/>'; i++; continue; }
    if (line.trim()===''){ i++; continue; }
    const buf=[line]; i++;
    while(i<lines.length && lines[i].trim()!=='' && !/^(#{1,6}\s|```|>\s?|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])) buf.push(lines[i++]);
    html += '<p>'+inline(buf.join(' '),dir)+'</p>';
  }
  return html;
}
function splitRow(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
}

function buildNav(){
  const nav = document.getElementById('nav'); nav.innerHTML='';
  for (const sec of KB.sections){
    const items = KB.docs.filter(d=>d.dir===sec);
    if (!items.length) continue;
    const h=document.createElement('div'); h.className='sec'; h.textContent=KB.labels[sec]||sec; nav.appendChild(h);
    for (const d of items){
      const a=document.createElement('a'); a.className='item'; a.href='#'+encodeURIComponent(d.id); a.dataset.id=d.id;
      a.innerHTML='<span class="t">'+esc(d.meta.title||d.id)+'</span><span class="ty">'+esc(d.meta.type||'')+'</span>';
      nav.appendChild(a);
    }
  }
}
function show(id){
  const d = byId.get(id) || byId.get('index.md'); if(!d) return;
  const m = d.meta;
  const wrap = document.getElementById('wrap');
  const tags = (Array.isArray(m.tags)?m.tags:[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
  const res = m.resource ? '<span class="tag res">source · <a href="'+m.resource+'">'+esc(m.resource.split('/').pop())+'</a></span>' : '';
  const ts = m.timestamp ? '<span class="tag">'+esc((m.timestamp||'').split('T')[0])+'</span>' : '';
  const out = d.outlinks.map(t=>'<a href="#'+encodeURIComponent(t)+'">'+esc((byId.get(t).meta.title)||t)+'</a>').join('') || '<span class="none">—</span>';
  const inl = d.inlinks.map(t=>'<a href="#'+encodeURIComponent(t)+'">'+esc((byId.get(t).meta.title)||t)+'</a>').join('') || '<span class="none">—</span>';
  wrap.innerHTML =
    '<div class="crumb">'+esc(d.id)+'</div>'+
    '<div class="metacard"><span class="ty">'+esc(m.type||'Concept')+'</span>'+
      '<h2>'+esc(m.title||d.id)+'</h2>'+
      (m.description?'<p class="desc">'+esc(m.description)+'</p>':'')+
      '<div class="metarows">'+res+ts+tags+'</div></div>'+
    '<div class="doc">'+render(d.body, d.dir)+'</div>'+
    '<div class="links"><div><h4>Links to →</h4>'+out+'</div><div><h4>← Linked from</h4>'+inl+'</div></div>';
  document.querySelectorAll('.nav a.item').forEach(a=>a.classList.toggle('active', a.dataset.id===d.id));
  document.querySelector('.main').scrollTop=0;
}
function route(){ const id = decodeURIComponent(location.hash.slice(1)); show(id||'index.md'); }
window.addEventListener('hashchange', route);
document.getElementById('q').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.nav a.item').forEach(a=>{
    const d=byId.get(a.dataset.id);
    const hay=((d.meta.title||'')+' '+(d.meta.type||'')+' '+(d.meta.description||'')+' '+(Array.isArray(d.meta.tags)?d.meta.tags.join(' '):'')).toLowerCase();
    a.classList.toggle('hide', q && !hay.includes(q));
  });
});
buildNav(); route();
</script>
</body>
</html>
