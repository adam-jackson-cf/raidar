<style>
  :root {

  .search input { width:100%; padding:7px 10px; border-radius:7px; border:1px solid var(--border); background:#0a0e13; color:var(--fg); font-size:12px; outline:none; }

  .main { overflow-y:auto; }
  .wrap { max-width:860px; margin:0 auto; padding:30px 40px 80px; }
  .crumb { font-size:11px; color:var(--fg-faint); font-family:var(--mono); margin-bottom:14px; }
  .metacard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:26px; }
  .metacard .ty { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); border:1px solid var(--border); border-radius:20px; padding:2px 9px; margin-bottom:8px; }

  .metarows { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:10.5px; font-family:var(--mono); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:2px 8px; color:var(--fg-dim); }
  .tag.res a { color:var(--cyan); }

  .doc p { margin:10px 0; }
  .doc ul,.doc ol { margin:10px 0; padding-left:22px; }
  .doc li { margin:4px 0; }
  .doc code { font-family:var(--mono); font-size:12px; background:var(--surface2); border:1px solid var(--border); border-radius:5px; padding:1px 5px; }
  .doc pre { background:#0a0e13; border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow-x:auto; }

  .doc blockquote { margin:12px 0; padding:6px 14px; border-left:3px solid var(--accent); color:var(--fg-dim); background:var(--surface); border-radius:0 8px 8px 0; }
  .doc table { border-collapse:collapse; width:100%; margin:14px 0; font-size:12.5px; display:block; overflow-x:auto; }
  .doc th,.doc td { border:1px solid var(--border); padding:7px 10px; text-align:left; vertical-align:top; }
  .doc th { background:var(--surface2); font-weight:600; color:var(--fg); }
  .doc tr:nth-child(even) td { background:rgba(255,255,255,.012); }
  .doc hr { border:none; border-top:1px solid var(--border); margin:24px 0; }

  .doc a.x::after { content:"↗"; font-size:9px; vertical-align:super; opacity:.6; }
  .links { margin-top:40px; border-top:1px solid var(--border); padding-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }

<script id="kb" type="application/json">{"docs":[{"id":"index.md","dir":".","meta":{"type":"Knowledge Bundle","title":"Raidar Review Surface — UX Knowledgebase","description":"A deep-dive UX review of the Raidar Review Surface — the personas it serves, the journey they travel, and an audit of every page, component, the questions each answers, and the data behind it.","resource":"../../review-surface/README.md","tags":["ux","review-surface","raidar","okf","knowledgebase"],"timestamp":"2026-06-15T00:00:00Z","okf_version":"0.1"},"body":"\n# Raidar Review Surface — UX Knowledgebase\n\nThis bundle is an [Open Knowledge Format](https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing/)\nprojection of the **Raidar Review Surface**: a Workshop-inspired web app for\nreviewing Raidar benchmark evidence. Each concept below is one markdown file\nwith YAML frontmatter; cross-links form the knowledge graph. Open\n[`visualiser.html`](./visualiser.html) for the rendered, navigable view.\n\n## What the surface is\n\nThe Review Surface answers one question chain for one audience: **\"Which\nagent spec delivers this scenario better → why did this run score what it\nscored → where in the process did it go wrong?\"** It is a *regenerable\nprojection* of `experiments/benchmarks/**`; the only data it owns is reviewer\nannotations.\n\nThree routes, two pages, one consistent verdict vocabulary:\n\n- **Experiments** (`/`) — compare agent specs per scenario revision.\n- **Runs** (`/runs`, `/runs/:runId`) — a run list plus a deep run-detail view.\n\nTagline in the app header: *Compare agent specs · Explain scores · Trace failures.*\n\n## Map of this bundle\n\n| Section | What it covers |\n|---|---|\n| [Personas](./personas/index.md) | Who uses the surface, their role, and the activities they perform |\n| [Customer journey](./journeys/index.md) | The compare → explain → trace path across the three personas |\n| [Pages](./pages/index.md) | The two pages / three page-views, the questions each answers, the data behind them |\n| [Components](./components/index.md) | Every UI component, its question, its data, its interactions |\n| [Data lineage](./data/index.md) | Source artifacts → projections → API → owned data |\n| [Concepts](./concepts/index.md) | The semantic verdict vocabulary and finding-category taxonomy |\n\n## How this audit was built\n\nThe page and component inventory was cross-checked against the Playwright\nend-to-end suite ([`tests/surface.spec.ts`](../../review-surface/tests/surface.spec.ts)),\nwhich exercises navigation, experiment comparison, all three run-detail states\n(failing / unscored / passing), per-run search, the span tree, annotations,\nthe runs sidebar, and the comparison visualisations. Every interactive element\ndocumented here is covered by at least one regression test, so the audit\nreflects the surface as it actually behaves, not just as designed.\n\n## Regenerating the visualiser\n\nThe bundle is the source of truth; the HTML is a generated consumer. After\nediting any `.md` file, rebuild the visualiser with a zero-dependency script:\n\n```bash\nnode docs/review-surface-ux-kb/build-visualiser.mjs\n```\n\nIt walks the bundle, parses each file's frontmatter + body, resolves\ncross-links into a graph, and writes a self-contained `visualiser.html` you can\nopen directly (`file://`) — no server or network required.\n\n## First principles the design enforces\n\n1. **Verdict first, metrics behind disclosure.** Every surface leads with a\n   plain-language verdict; granular numbers sit behind progressive disclosure.\n   See [verdict semantics](./concepts/verdict-semantics.md).\n2. **Raidar artifacts are authoritative.** Everything shown is regenerable from\n   `experiments/benchmarks/**`. See [source artifacts](./data/source-artifacts.md).\n3. **Evidence is one click away.** Findings, scorecard checks, and gates all\n   deep-link to the span that proves them.\n","outlinks":["personas/index.md","journeys/index.md","pages/index.md","components/index.md","data/index.md","concepts/index.md","concepts/verdict-semantics.md","data/source-artifacts.md"],"inlinks":[]},{"id":"personas/index.md","dir":"personas","meta":{"type":"Persona Index","title":"Personas","description":"The three personas the Review Surface serves, each entering at a different depth of the verdict → evidence chain.","tags":["personas","ux"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Personas\n\nThe surface is built around a **zoom-in gradient**: each persona starts\nzoomed-out with a plain-language verdict and drills toward raw evidence. They\nare not separate audiences with separate tools — they are the same review act\nat three depths, and the UI hands a reviewer from one to the next.\n\n| Persona | Core question | Landing surface |\n|---|---|---|\n| [Benchmark reviewer / platform lead](./benchmark-reviewer.md) | Which agent spec delivers this scenario better, and can I trust the sample? | [Experiments page](../pages/experiments.md) |\n| [Scenario / eval engineer](./eval-engineer.md) | Why did this run score what it scored, and is the contract right? | [Run detail](../pages/run-detail.md) |\n| [Agent / harness debugger](./harness-debugger.md) | Where in the delivery process did it go wrong? | [Span tree](../components/span-tree.md) |\n\nThe [customer journey](../journeys/customer-journey.md) shows how a single\ninvestigation flows across all three.\n","outlinks":["personas/benchmark-reviewer.md","pages/experiments.md","personas/eval-engineer.md","pages/run-detail.md","personas/harness-debugger.md","components/span-tree.md","journeys/customer-journey.md"],"inlinks":["index.md","journeys/index.md"]},{"id":"personas/benchmark-reviewer.md","dir":"personas","meta":{"type":"Persona","title":"Benchmark reviewer / platform lead","description":"Compares agent specs to decide which harness+model pairing delivers a scenario best, whether a revision helped, and whether the sample is trustworthy.","tags":["persona","comparison","decision-maker"],"timestamp":"2026-06-15T00:00:00Z","persona_id":"benchmark-reviewer","lands_on":"experiments"},"body":"\n# Benchmark reviewer / platform lead\n\n## Role\n\nOwns the decision of **which AgentSpec (harness + model) to back** for a given\nclass of delivery work. Thinks in terms of fleet-level trade-offs — delivery\nquality vs. cost vs. consistency — not individual traces. Often a platform or\nengineering lead who needs a defensible verdict, not a metrics dump.\n\n## Core question\n\n> \"Which agent spec delivers this scenario better, did a revision change help,\n> and can I trust the sample?\"\n\n## Activities they perform\n\n| Activity | Where it happens | What answers it |\n|---|---|---|\n| Read the per-revision verdict headline | [Experiments page](../pages/experiments.md) group headline | \"Best delivery: `<spec>` — delivered to spec (0.93). `<spec>` trails by 0.08.\" |\n| Rank specs by delivery quality | [Comparison table](../pages/experiments.md) — Delivery column | [Delivery tier](../concepts/delivery-tiers.md) + Δ-vs-best |\n| Judge whether results are repeatable | Repeatability column | [Repeatability / spread tier](../concepts/repeatability.md) |\n| Decide whether to trust the numbers at all | Confidence column | [Sample confidence tier](../concepts/sample-confidence.md) + unscored count |\n| Weigh cost against quality | Pace + Tokens columns; [trade-off scatter](../components/tradeoff-scatter.md) | duration mean, uncached input-token mean |\n| See what recurringly breaks | [Failure patterns](../components/failure-patterns.md) | failed-gate + issue-category rollups |\n| Decide if a revision helped or hurt | [Revision movement](../components/revision-movement.md) | score movement + contract diffs + comparability warnings |\n| Pick the run worth opening first | Headline \"Start with Run NN\" link; [run pills](../pages/experiments.md) | most-issues / failing run |\n\n## Where the journey hands them off\n\nThe headline's *\"Start with Run NN\"* link and the [run pills](../pages/experiments.md)\nhand this persona to the [eval engineer](./eval-engineer.md) view — a specific\n[run detail](../pages/run-detail.md). The reviewer decides *what to investigate*;\nthe eval engineer finds out *why*.\n\n## Design tension to watch\n\nThe Delivery tier is a **presentation band, not a canonical Raidar grade** —\nRaidar has no composite grade (see [delivery tiers](../concepts/delivery-tiers.md)).\nA reviewer could over-trust \"Strong\" as if it were an official rating. The Δ-vs-best,\nRepeatability, and Confidence columns exist precisely to keep the verdict honest.\n","outlinks":["pages/experiments.md","concepts/delivery-tiers.md","concepts/repeatability.md","concepts/sample-confidence.md","components/tradeoff-scatter.md","components/failure-patterns.md","components/revision-movement.md","personas/eval-engineer.md","pages/run-detail.md"],"inlinks":["components/group-headline.md","pages/index.md","personas/eval-engineer.md","personas/index.md"]},{"id":"personas/eval-engineer.md","dir":"personas","meta":{"type":"Persona","title":"Scenario / eval engineer","description":"Explains why a single run scored what it did and validates whether the scenario contract (gates, requirements, scorers) is correct.","tags":["persona","scoring","scenario-contract"],"timestamp":"2026-06-15T00:00:00Z","persona_id":"eval-engineer","lands_on":"run-detail"},"body":"\n# Scenario / eval engineer\n\n## Role\n\nOwns the **scenario contract** — the requirements, verification gates, and\nscorer/metric weights that decide a run's score. When a score looks wrong, this\npersona must decide: did the agent genuinely underdeliver, or is the contract\nmis-calibrated (a gate too strict, a requirement unstated, a judge disagreeing\nwith deterministic evidence)?\n\n## Core question\n\n> \"Why did this run score what it scored, and is the scenario contract right?\"\n\n## Activities they perform\n\n| Activity | Where it happens | What answers it |\n|---|---|---|\n| Read the one-sentence outcome | [Run header](../components/run-header.md) verdict banner | `runSummary()` — tier blurb + failed gates + issue count + validity |\n| See the score broken into areas | [Scorecard panel](../components/scorecard-panel.md) | scorer spans → each area's share of the composite with bars |\n| Trace a check to its evidence | Scorecard check buttons (\"…of this area\") | click selects the metric/scorer [span](../components/span-tree.md) |\n| Read findings in plain language | [Findings & annotations](../components/annotation-cards.md) | Raidar `findings.json` projected as evidence-linked annotations |\n| Jump from a finding to its proof | Finding \"jump:\" buttons | deep-link to the evidence span |\n| Confirm gates passed/failed | [Gate chips](../components/gate-chips.md) | `gate:*` spans, status from exit codes |\n| Understand why a run is unscored | Unscored verdict banner | `unscored_reasons` (e.g. \"harness exited before verification\") |\n| Inspect raw ids & source artifacts | \"Technical details\" disclosure | run id, sub-scores, `artifact_paths` |\n| Record a contract judgement | [Annotation create form](../components/annotation-create-form.md) | writes a `user` annotation |\n\n## Where the journey hands them off\n\nWhen the scorecard or a finding points at a process failure — a gate that\nerrored, a command that never ran — the engineer clicks through to the\n[span tree](../components/span-tree.md) and becomes the\n[harness debugger](./harness-debugger.md). The \"Compare agent specs\" link in the\nrun header sends them back up to the [reviewer](./benchmark-reviewer.md) view.\n\n## Design tension to watch\n\nLong ids and source-artifact paths are deliberately hidden behind a \"Technical\ndetails\" disclosure so the scorecard stays readable — but this persona\nsometimes *needs* the raw scorer id to reconcile against the scenario YAML. The\ndisclosure keeps that one click away rather than removing it.\n","outlinks":["components/run-header.md","components/scorecard-panel.md","components/span-tree.md","components/annotation-cards.md","components/gate-chips.md","components/annotation-create-form.md","personas/harness-debugger.md","personas/benchmark-reviewer.md"],"inlinks":["components/run-header.md","pages/index.md","personas/benchmark-reviewer.md","personas/harness-debugger.md","personas/index.md"]},{"id":"personas/harness-debugger.md","dir":"personas","meta":{"type":"Persona","title":"Agent / harness debugger","description":"Works at the deepest layer — the execution trace — to locate where in the delivery process a run went wrong.","tags":["persona","trace","debugging"],"timestamp":"2026-06-15T00:00:00Z","persona_id":"harness-debugger","lands_on":"span-tree"},"body":"\n# Agent / harness debugger\n\n## Role\n\nDebugs the **delivery process itself**: the agent's command/message/file-edit\nstream, the verification gates, and the scoring phases. This persona treats the\nrun as a trace to be walked, not a score to be read. Span names map 1:1 to the\nunderlying Raidar trace, so this is the layer where the abstraction stops and\nthe raw evidence begins.\n\n## Core question\n\n> \"Where in the delivery process did it go wrong?\"\n\n## Activities they perform\n\n| Activity | Where it happens | What answers it |\n|---|---|---|\n| Walk the execution tree | [Span tree](../components/span-tree.md) | spans: agent trace, gates, scoring phases |\n| See where time went | Duration timeline bars in the tree | `start_time_ms` / `end_time_ms` / `duration_ms` |\n| Jump straight to failures | Error-cycle button | spans with `status: ERROR` |\n| Expand / collapse the trace | Expand-all / collapse-to-sections buttons | span hierarchy |\n| Navigate hands-free | Keyboard (↑↓ move, ←→ fold, Esc clear) | tree focus model |\n| Hunt for a command or string | [Search panel](../components/search-panel.md) | substring/regex over span payloads |\n| Read a span's full payload | [Span detail](../components/span-detail.md) | `input_payload` / `output_payload`, model, tokens |\n| Copy a payload for offline analysis | Copy-payload button | clipboard |\n| Annotate a precise failure point | [Annotation create form](../components/annotation-create-form.md) | `user` annotation attached to the span |\n\n## Where the journey ends\n\nThis is the deepest layer; there is no further hand-off. A finding here\n(e.g. \"gate failed because `bun run test` was never invoked\") closes the loop —\nit either confirms the agent underdelivered or proves the scenario contract is\nwrong, feeding the [eval engineer's](./eval-engineer.md) contract decision.\n\n## Design tension to watch\n\nThe span tree is the one place the plain-language abstraction is intentionally\ndropped: raw span names are shown verbatim because fidelity to the trace\nmatters more than friendliness here. Search and the error-cycle exist so this\nraw layer stays navigable at scale.\n","outlinks":["components/span-tree.md","components/search-panel.md","components/span-detail.md","components/annotation-create-form.md","personas/eval-engineer.md"],"inlinks":["components/search-panel.md","components/span-tree.md","pages/index.md","personas/eval-engineer.md","personas/index.md"]},{"id":"journeys/index.md","dir":"journeys","meta":{"type":"Journey Index","title":"Customer journeys","description":"How the three personas' activities chain into one continuous investigation across the surface.","tags":["journey","ux"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Customer journeys\n\nThe surface is designed as a single funnel, not three disconnected tools. The\ncanonical journey — [compare → explain → trace](./customer-journey.md) — walks\na reviewer from a fleet-level verdict down to the exact span that explains a\nfailure, handing off between [personas](../personas/index.md) at each step.\n\n- [Compare → Explain → Trace](./customer-journey.md) — the primary journey.\n","outlinks":["journeys/customer-journey.md","personas/index.md"],"inlinks":["index.md"]},{"id":"journeys/customer-journey.md","dir":"journeys","meta":{"type":"Journey","title":"Compare → Explain → Trace","description":"The end-to-end investigation path — from \"which spec wins\" to \"why this run scored\" to \"where it broke\" — mapped to personas, pages, and the data behind each step.","tags":["journey","funnel","end-to-end"],"timestamp":"2026-06-15T00:00:00Z","journey_id":"compare-explain-trace"},"body":"\n# Customer journey: Compare → Explain → Trace\n\nOne investigation, three depths. The surface's tagline —\n*Compare agent specs · Explain scores · Trace failures* — **is** the journey.\nEach stage zooms in one level and hands off to the next persona.\n\n```\nCOMPARE                      EXPLAIN                      TRACE\n(reviewer)                   (eval engineer)              (harness debugger)\nExperiments page    ──▶      Run detail            ──▶    Span tree + detail\n  verdict headline             verdict banner               execution timeline\n  comparison table             scorecard breakdown          error cycling\n  trade-off scatter            findings → evidence          payload search\n  failure patterns             gate chips                   copy payload\n  revision movement            technical details            annotate the span\n        │                            │                            │\n   \"Start with Run NN\" ────────▶  \"jump:\" / check ──────────▶  raw span\n   run pill click                  click → span                evidence\n```\n\n## Stage 1 — Compare (Benchmark reviewer)\n\n**Entry:** lands on the [Experiments page](../pages/experiments.md). Scenario\nfamilies are grouped by revision.\n\n1. Reads the **group headline** — a single sentence naming the best spec, its\n   tier and score, the runner-up's gap, and the run worth opening first.\n2. Scans the **comparison table**: [Delivery](../concepts/delivery-tiers.md),\n   [Repeatability](../concepts/repeatability.md),\n   Issues, [Confidence](../concepts/sample-confidence.md), Pace, Tokens.\n3. Expands a row to see *where points were lost* vs *what held up*, score-area\n   bars, evidence-linked findings, and [run pills](../pages/experiments.md).\n4. Cross-checks cost/quality on the [trade-off scatter](../components/tradeoff-scatter.md),\n   recurring breakage on [failure patterns](../components/failure-patterns.md),\n   and whether a revision helped on [revision movement](../components/revision-movement.md).\n\n**Hand-off:** clicks *\"Start with Run NN\"* in the headline or a run pill →\n[run detail](../pages/run-detail.md).\n\n**Data behind it:** `data/experiments.json` (aggregates, metric/scorer\noutcomes, sample adequacy, revision diffs) + `data/runs.json` for per-run pills.\nSee [projections](../data/projections.md).\n\n## Stage 2 — Explain (Scenario / eval engineer)\n\n**Entry:** the [run detail](../pages/run-detail.md) view opens with a\n[verdict banner](../components/run-header.md).\n\n1. Reads the **one-sentence outcome** and gate chips.\n2. Works down the [scorecard](../components/scorecard-panel.md) — each score\n   area shows its share of the composite; each check is click-to-evidence.\n3. Reads the [findings & annotations](../components/annotation-cards.md), each\n   linked to the span that proves it.\n4. Opens **Technical details** only if the raw scorer ids / artifact paths are\n   needed to reconcile against the scenario contract.\n\n**Hand-off:** clicks a scorecard check or a finding's *\"jump:\"* button → selects\nthe evidence [span](../components/span-tree.md).\n\n**Data behind it:** `data/runs/<id>.json` — the run record, projected spans, and\nfindings-as-annotations. See [projections](../data/projections.md).\n\n## Stage 3 — Trace (Agent / harness debugger)\n\n**Entry:** a span is selected in the [span tree](../components/span-tree.md);\n[span detail](../components/span-detail.md) opens on the right.\n\n1. Walks the tree (agent trace → gates → scoring), reading the duration timeline.\n2. Cycles errors, or [searches](../components/search-panel.md) the run's payloads\n   for a command or string.\n3. Reads the full `input_payload` / `output_payload` in span detail; copies it.\n4. **Annotates** the precise failure point with an\n   [issue/good/note](../components/annotation-create-form.md).\n\n**Loop closure:** the annotation and the located evidence feed back to the eval\nengineer's verdict on whether the *contract* or the *agent* is at fault — and,\naggregated across runs, back to the reviewer's spec decision.\n\n## Side paths\n\n- **Browse-first entry:** a user can skip the comparison and enter via the\n  [Runs page](../pages/runs-index.md) sidebar, filtering by scenario / spec / id.\n  The empty state nudges them back to Experiments (\"points you to the run worth\n  opening first\").\n- **Unscored detour:** if the chosen run is unscored, the run detail shows a\n  dedicated banner explaining *why* (e.g. harness exited before verification)\n  rather than a misleading zero — see [run detail](../pages/run-detail.md).\n- **Upward navigation:** \"Compare agent specs\" in the run header returns the\n  engineer to the originating scenario family on the Experiments page.\n","outlinks":["pages/experiments.md","concepts/delivery-tiers.md","concepts/repeatability.md","concepts/sample-confidence.md","components/tradeoff-scatter.md","components/failure-patterns.md","components/revision-movement.md","pages/run-detail.md","data/projections.md","components/run-header.md","components/scorecard-panel.md","components/annotation-cards.md","components/span-tree.md","components/span-detail.md","components/search-panel.md","components/annotation-create-form.md","pages/runs-index.md"],"inlinks":["journeys/index.md","pages/run-detail.md","personas/index.md"]},{"id":"pages/index.md","dir":"pages","meta":{"type":"Page Index","title":"Pages","description":"The two pages / three page-views of the Review Surface, the questions each answers, and the data behind them.","tags":["pages","ux","audit"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Pages\n\nThe surface has **two React pages over three routes**, wrapped in a shared\n[layout](../components/layout-shell.md) (header + Experiments/Runs nav).\n\n| Page | Route(s) | Primary persona | Core question |\n|---|---|---|---|\n| [Experiments](./experiments.md) | `/` | [Benchmark reviewer](../personas/benchmark-reviewer.md) | Which agent spec wins this scenario revision? |\n| [Runs (list)](./runs-index.md) | `/runs` | any | Which run do I want to open? |\n| [Run detail](./run-detail.md) | `/runs/:runId` | [Eval engineer](../personas/eval-engineer.md) + [harness debugger](../personas/harness-debugger.md) | Why did this run score what it scored, and where did it break? |\n\nRouting: any unmatched path redirects to `/` (`router.tsx`). The Runs route\nrenders the list always and the detail view when a `:runId` is present, so the\nsidebar stays visible alongside the open run.\n\nEach page doc below lists, per UI region: the **question it answers**, the\n**component(s)** that render it, and the **data** that feeds it.\n","outlinks":["components/layout-shell.md","pages/experiments.md","personas/benchmark-reviewer.md","pages/runs-index.md","pages/run-detail.md","personas/eval-engineer.md","personas/harness-debugger.md"],"inlinks":["index.md"]},{"id":"pages/runs-index.md","dir":"pages","meta":{"type":"Page","title":"Runs page (list / sidebar)","description":"The run browser — a filterable sidebar grouped by experiment, with an empty-state that routes browsers toward the comparison view.","resource":"../../../review-surface/src/pages/RunsPage.tsx","tags":["page","runs","navigation"],"timestamp":"2026-06-15T00:00:00Z","route":"/runs"},"body":"\n# Runs page (list / sidebar)\n\nRoute `/runs` (and `/runs/:runId`). A left sidebar lists every projected run;\nthe main pane shows either the [run detail](./run-detail.md) (when a run is\nselected) or an empty state.\n\n## Regions, questions, and data\n\n| Region | Question it answers | Component | Data |\n|---|---|---|---|\n| Filter input | How do I find a specific run? | inline `<input>` | filters on `scenario`, `agent_spec`, `id` |\n| Grouped run list | What runs exist, grouped by experiment? | [`RunListItem`](../components/run-list-item.md) | grouped by `experiment_id`; header shows `scenario@revision` + `agent_spec` |\n| Run list item | How did this run score and what's wrong with it? | [`RunListItem`](../components/run-list-item.md) + [`ScoreVerdict`](../components/verdict.md) + [`FindingChips`](../components/finding-chips.md) | `composite_score`, `unscored`, `status`, `finding_counts`, `synthetic` |\n| No-match message | Did my filter match anything? | inline | filtered list length |\n| Empty main pane | Where should I start if I have no run in mind? | inline | links to [Experiments](./experiments.md) |\n\n## Behaviours (regression-covered)\n\n- Filtering narrows the list and shows \"No runs match the filter\" when empty.\n- Selecting a run navigates to `/runs/:runId` (sidebar stays mounted).\n- The empty state's \"Experiments\" link returns to `/`.\n\n## Notes\n\n- Runs are grouped by `experiment_id`; the group header is sticky while scrolling.\n- Data source: [`/api/runs`](../data/api.md) → `data/runs.json`.\n","outlinks":["pages/run-detail.md","components/run-list-item.md","components/verdict.md","components/finding-chips.md","pages/experiments.md","data/api.md"],"inlinks":["components/run-list-item.md","data/api.md","journeys/customer-journey.md","pages/index.md","pages/run-detail.md"]},{"id":"pages/experiments.md","dir":"pages","meta":{"type":"Page","title":"Experiments page","description":"The comparison surface — per-revision verdict headline, the agent-spec comparison table, and below-the-fold trade-off, failure-pattern, and revision-movement analysis.","resource":"../../../review-surface/src/pages/ExperimentsPage.tsx","tags":["page","comparison","experiments"],"timestamp":"2026-06-15T00:00:00Z","route":"/","persona":"benchmark-reviewer"},"body":"\n# Experiments page\n\nThe landing page (`/`). Experiments are grouped into **scenario families →\nrevisions**, each revision rendered as one comparison group. A family-anchor nav\nappears when more than one family is present.\n\n## Regions, questions, and data\n\n| Region | Question it answers | Component | Data |\n|---|---|---|---|\n| Family anchor nav | Which scenarios exist? | inline `<nav aria-label=\"Scenario families\">` | distinct `scenario` keys |\n| Group header | What is this scenario, how hard, what category? | inline | `scenario_meta.description / difficulty / category` |\n| **Group headline** | Who wins, by how much, and what should I open first? | [`GroupHeadline`](../components/group-headline.md) | best/runner-up `composite_score.mean`; worst run by `finding_counts.issue` |\n| **Comparison table** | How do the specs rank across delivery, repeatability, issues, confidence, cost? | inline table + [`Verdict`](../components/verdict.md) | per-spec `aggregate.*`, `sample`, `finding_counts` |\n| — Delivery column | How well did it deliver? | [`ScoreVerdict`](../components/verdict.md) | `composite_score` (mean/median/stddev/min/max) → [tier](../concepts/delivery-tiers.md) |\n| — Repeatability column | Are repeats consistent? | [`spreadTier`](../concepts/repeatability.md) | `composite_score.stddev` vs 0.1 threshold |\n| — Issues column | Is anything wrong here? | inline | `findingCounts` across exp + its runs |\n| — Confidence column | Can I trust this sample? | [`sampleTrust`](../concepts/sample-confidence.md) | `sample.minimum_met / preferred_met`, scored/total, `unscored_count` |\n| — Pace column | How long does it take? | inline | `aggregate.duration_sec.mean` |\n| — Tokens column | What does it cost? | inline | `aggregate.uncached_input_tokens.mean` |\n| **Row expansion** | Where exactly were points lost vs held? | [`ExperimentExpansion`](../components/experiment-expansion.md) | `metric_outcomes`, `scorer_outcomes`, `findings`, `run_ids` |\n| — Run pills | Which individual runs sit under this spec? | [`RunPill` / `FindingChips`](../components/run-pill.md) | per-run `composite_score`, `status`, `finding_counts` |\n| [Trade-off scatter](../components/tradeoff-scatter.md) | Which runs are fast *and* good? | `TradeoffScatter` | per-run `composite_score`, `duration_ms`, `status`, `agent_spec` |\n| [Failure patterns](../components/failure-patterns.md) | What keeps breaking in this family? | `FailurePatterns` | `failed_gates`, `issue_categories` across family runs |\n| [Revision movement](../components/revision-movement.md) | Did changing the scenario move the score — and is it even comparable? | `RevisionMovement` | `aggregate` per revision + `revision_diffs` (contract/prompt diffs, comparability warnings) |\n\n## States\n\n- **Loading / error** — inline messages.\n- **Empty** — a call-to-action with the exact commands to generate data\n  (`make benchmark-fixture-synthetic && make review-surface-data`).\n\n## Notes\n\n- The \"best\" row is highlighted (accent left-border + trophy) only when the\n  group has more than one spec.\n- The Issues column intentionally counts **both** experiment-level findings and\n  run-level findings, so a clean aggregate can't hide a troubled run.\n- Data source: [`/api/experiments`](../data/api.md) → `data/experiments.json`.\n","outlinks":["components/group-headline.md","components/verdict.md","concepts/delivery-tiers.md","concepts/repeatability.md","concepts/sample-confidence.md","components/experiment-expansion.md","components/run-pill.md","components/tradeoff-scatter.md","components/failure-patterns.md","components/revision-movement.md","data/api.md"],"inlinks":["components/run-header.md","concepts/repeatability.md","concepts/sample-confidence.md","data/api.md","journeys/customer-journey.md","pages/index.md","pages/runs-index.md","personas/benchmark-reviewer.md","personas/index.md"]},{"id":"pages/run-detail.md","dir":"pages","meta":{"type":"Page","title":"Run detail","description":"The deep run view — verdict banner, scorecard breakdown, findings & annotations, per-run search, span tree, and span detail — stacked from plain-language verdict down to raw payload.","resource":"../../../review-surface/src/pages/RunsPage.tsx","tags":["page","run-detail","scoring","trace"],"timestamp":"2026-06-15T00:00:00Z","route":"/runs/:runId","persona":"eval-engineer"},"body":"\n# Run detail\n\nRendered by `RunDetailView` inside the [Runs page](./runs-index.md) when a\n`:runId` is present. It is the spine of the [customer journey's](../journeys/customer-journey.md)\nExplain and Trace stages, stacked top-to-bottom from verdict to raw evidence.\n\n## Regions, questions, and data\n\n| Region (top → bottom) | Question it answers | Component | Data |\n|---|---|---|---|\n| **Verdict banner** | In one sentence, what happened? | [`RunHeader`](../components/run-header.md) | `runSummary()` over `composite_score`, `failed_gates`, `finding_counts`, `valid`, `unscored_reasons` |\n| Gate chips (in header) | Which gates passed/failed? | [`GateChips`](../components/gate-chips.md) | `gate:*` spans + status |\n| Compare-specs link | How does this run compare to siblings? | inline | links to `#family-<scenario>` |\n| Technical details disclosure | What are the raw ids, sub-scores, artifacts? | [`RunHeader`](../components/run-header.md) | run id, `quality_score`, `diagnostic_score`, `artifact_paths` |\n| **Scorecard** | Why did it score this — which areas, which checks? | [`ScorecardPanel`](../components/scorecard-panel.md) | `scorer:*` / `metric:*` spans (weight, score, contributions) |\n| **Findings & annotations** | What did Raidar flag, and what have reviewers noted? | [`AnnotationCards`](../components/annotation-cards.md) + [`FindingChips`](../components/finding-chips.md) | `annotations` (raidar findings + user notes), `finding_counts` |\n| Annotate form | How do I record what I noticed? | [`AnnotationCreateForm`](../components/annotation-create-form.md) | writes a `user` annotation (optionally span-scoped) |\n| **Search** | Where in this run did X happen? | [`SearchPanel`](../components/search-panel.md) | `/api/runs/:id/search` over span payloads |\n| **Span tree** | How is the run structured; where's the error/time? | [`SpanTree`](../components/span-tree.md) | `spans` (hierarchy, status, timing) + span annotations |\n| **Span detail** | What's the full context of the selected span? | [`SpanDetail`](../components/span-detail.md) + [`JsonView`](../components/json-view.md) | selected `Span` payloads, model, tokens + its annotations |\n\n## The three states (all regression-covered)\n\n| State | Banner | What's distinctive |\n|---|---|---|\n| **Passing** (`Strong`) | \"Delivered to spec\" | green scorecard checks, `good` findings |\n| **Failing** (`Failing`) | \"Did not deliver\" | clickable failed-gate chips, issue findings with jump-to-evidence |\n| **Unscored** | \"This run was not scored\" | dedicated \"Why this run is unscored\" banner from `unscored_reasons` (e.g. \"harness exited before verification\") — no misleading score |\n\n## Cross-cutting interactions\n\n- **Span selection is URL state** (`?span=<id>`), so every deep-link (gate chip,\n  scorecard check, finding jump, tree click, search result, error-cycle, keyboard\n  nav) is shareable and back-button friendly.\n- Selecting a span splits the layout: tree on the left (~60%), detail on the right (~40%).\n- Data source: [`/api/runs/detail/:id`](../data/api.md) → `data/runs/<id>.json`.\n","outlinks":["pages/runs-index.md","journeys/customer-journey.md","components/run-header.md","components/gate-chips.md","components/scorecard-panel.md","components/annotation-cards.md","components/finding-chips.md","components/annotation-create-form.md","components/search-panel.md","components/span-tree.md","components/span-detail.md","components/json-view.md","data/api.md"],"inlinks":["components/group-headline.md","components/tradeoff-scatter.md","data/api.md","data/projections.md","journeys/customer-journey.md","pages/index.md","pages/runs-index.md","personas/benchmark-reviewer.md","personas/index.md"]},{"id":"components/index.md","dir":"components","meta":{"type":"Component Index","title":"Components","description":"Every UI component of the Review Surface — the question each answers, the data it consumes, and the page it lives on.","tags":["components","ux","audit"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Components\n\nThe surface is ~17 React components plus a few inline regions. They are\nadapted from Raindrop Workshop's app and re-skinned over Raidar's data model.\nEach file below documents one component as an OKF concept: **purpose →\nquestion → data → interactions → page**.\n\n## Catalog\n\n| Component | Question it answers | Page |\n|---|---|---|\n| [Layout shell](./layout-shell.md) | Where am I; how do I switch views? | all |\n| [Verdict (Tier / ScoreVerdict / ScoreBar)](./verdict.md) | What tier is this score? | all |\n| [GroupHeadline](./group-headline.md) | Who wins this revision and what do I open first? | Experiments |\n| [Experiment expansion](./experiment-expansion.md) | Where were points lost vs held? | Experiments |\n| [RunPill](./run-pill.md) | How did this individual run do? | Experiments |\n| [TradeoffScatter](./tradeoff-scatter.md) | Which runs are fast *and* good? | Experiments |\n| [FailurePatterns](./failure-patterns.md) | What keeps breaking? | Experiments |\n| [RevisionMovement](./revision-movement.md) | Did the contract change move the score? | Experiments |\n| [RunListItem](./run-list-item.md) | Which run am I looking at? | Runs list |\n| [RunHeader](./run-header.md) | What's the run's overall outcome? | Run detail |\n| [GateChips](./gate-chips.md) | Which gates passed/failed? | Run detail |\n| [ScorecardPanel](./scorecard-panel.md) | Why did it score this? | Run detail |\n| [AnnotationCards](./annotation-cards.md) | What was flagged or noted? | Run detail |\n| [AnnotationCreateForm](./annotation-create-form.md) | How do I record what I noticed? | Run detail |\n| [AnnotationChip](./annotation-chip.md) | Is there an annotation here, of what kind? | Run detail |\n| [FindingChips](./finding-chips.md) | How many issues/good/notes? | Run detail, Experiments |\n| [SearchPanel](./search-panel.md) | Where in this run did X happen? | Run detail |\n| [SpanTree](./span-tree.md) | How is the run structured; where's the error? | Run detail |\n| [SpanDetail](./span-detail.md) | What's the full context of this span? | Run detail |\n| [JsonView](./json-view.md) | What was the raw payload? | Run detail |\n| [Badge](./badge.md) | Is this run synthetic / invalid? | Run detail, Runs list |\n\nAll components render through the shared [verdict vocabulary](../concepts/verdict-semantics.md)\nand consume the [projected data model](../data/projections.md).\n","outlinks":["components/layout-shell.md","components/verdict.md","components/group-headline.md","components/experiment-expansion.md","components/run-pill.md","components/tradeoff-scatter.md","components/failure-patterns.md","components/revision-movement.md","components/run-list-item.md","components/run-header.md","components/gate-chips.md","components/scorecard-panel.md","components/annotation-cards.md","components/annotation-create-form.md","components/annotation-chip.md","components/finding-chips.md","components/search-panel.md","components/span-tree.md","components/span-detail.md","components/json-view.md","components/badge.md","concepts/verdict-semantics.md","data/projections.md"],"inlinks":["index.md"]},{"id":"components/annotation-cards.md","dir":"components","meta":{"type":"Component","title":"AnnotationCards","description":"Renders Raidar findings and user notes as issue/good/note cards with category labels and evidence references that jump to the proving span.","resource":"../../../review-surface/src/components/AnnotationCards.tsx","tags":["component","run-detail","findings","annotations"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# AnnotationCards\n\n**Purpose.** Presents both machine findings (`source: raidar`) and human notes\n(`source: user`) in one evidence-linked list, issues first.\n\n**Question answered.** *What did Raidar flag and what have reviewers noted — and\nwhere's the proof?*\n\n**Data.** `Annotation[]`: `kind`, `source`, `category`\n([labelled](../concepts/finding-categories.md)), `note`, `span_id`, and\n`evidence[]` (`source`, `reference`, `detail`). A `spanNameById` map resolves\njump targets.\n\n**Interactions.** \"jump:\" buttons select the evidence span (`?span=`); user\nannotations (`id` prefixed `user-`) show a delete button; Raidar findings are\nimmutable.\n\n**Page.** Run detail (Findings & annotations section, and within span detail).\n","outlinks":["concepts/finding-categories.md"],"inlinks":["components/annotation-create-form.md","components/index.md","concepts/finding-categories.md","data/owned-data.md","journeys/customer-journey.md","pages/run-detail.md","personas/eval-engineer.md"]},{"id":"components/annotation-chip.md","dir":"components","meta":{"type":"Component","title":"AnnotationChip","description":"A compact icon-only badge for an annotation's kind (issue/good/note) and source, shown inline on spans and lists.","resource":"../../../review-surface/src/components/AnnotationChip.tsx","tags":["component","annotations","indicator"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# AnnotationChip\n\n**Purpose.** A glanceable marker that an annotation exists, exporting the shared\n`KIND_STYLES` (icon/colour/label per kind) reused across the surface.\n\n**Question answered.** *Is there an annotation here, and what kind/source is it?*\n\n**Data.** `Annotation` (`kind`, `source`); note preview in the title.\n\n**Interactions.** Hover for the note preview; otherwise indicator-only.\n\n**Page.** Run detail (span-tree rows, finding chips). `KIND_STYLES` is also\nimported by the Experiments page for finding rendering.\n","outlinks":[],"inlinks":["components/index.md","components/span-tree.md"]},{"id":"components/annotation-create-form.md","dir":"components","meta":{"type":"Component","title":"AnnotationCreateForm","description":"Always-visible form to record an issue/good/note against the run or a selected span — the only place the surface writes data.","resource":"../../../review-surface/src/components/AnnotationCreateForm.tsx","tags":["component","run-detail","annotations","write"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# AnnotationCreateForm\n\n**Purpose.** Lets reviewers capture judgements — the surface's one mutation and\nits [only owned data](../data/owned-data.md).\n\n**Question answered.** *How do I record what I noticed about this run or span?*\n\n**Data.** Form state (`kind` ∈ issue/good/note, `note` text) plus an optional\nselected `Span` (`id`, `name`) to scope the annotation. Submits via\n[`POST /api/annotations`](../data/api.md).\n\n**Interactions.** Kind toggle switches the submit affordance (\"Annotate run\" /\n\"Annotate this span\"); Cmd+Enter or button submits; \"use run instead\" detaches\nfrom the span. Created notes appear in [AnnotationCards](./annotation-cards.md)\nand are deletable.\n\n**Page.** Run detail (Findings & annotations section).\n","outlinks":["data/owned-data.md","data/api.md","components/annotation-cards.md"],"inlinks":["components/index.md","components/span-detail.md","data/owned-data.md","journeys/customer-journey.md","pages/run-detail.md","personas/eval-engineer.md","personas/harness-debugger.md"]},{"id":"components/badge.md","dir":"components","meta":{"type":"Component","title":"Badge","description":"A small uppercase pill (e.g. SYNTHETIC, INVALID) flagging a run's provenance or validity.","resource":"../../../review-surface/src/components/Badge.tsx","tags":["component","indicator"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail","runs-index","experiments"]},"body":"\n# Badge\n\n**Purpose.** A minimal provenance/validity flag.\n\n**Question answered.** *Is this run synthetic (demo fixture) or invalid?*\n\n**Data.** A label string + optional colour, driven by `synthetic` / `valid` on a\n`RunRecord` or `ExperimentRecord`.\n\n**Interactions.** Display only.\n\n**Page.** Run [header](./run-header.md), [run list items](./run-list-item.md),\nand the Experiments comparison rows.\n","outlinks":["components/run-header.md","components/run-list-item.md"],"inlinks":["components/index.md","components/run-header.md","components/run-list-item.md"]},{"id":"components/experiment-expansion.md","dir":"components","meta":{"type":"Component","title":"Experiment expansion","description":"The expanded body of a comparison row — run pills, \"where points were lost\" vs \"what held up\" metric bars, score-area chips, and experiment-level findings.","resource":"../../../review-surface/src/pages/ExperimentsPage.tsx","tags":["component","experiments","drilldown"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# Experiment expansion\n\n**Purpose.** Splits a spec's aggregate into a diagnostic so the reviewer sees\n*exactly* where the score came from before drilling into a run.\n\n**Question answered.** *For this spec, where were points lost, what held up,\nand which runs back that up?*\n\n**Data.** From the `ExperimentRecord`:\n- `metric_outcomes` — split into **failing** (`pass_rate < 1`, sorted worst-first)\n  vs **passing**, each row a [`MetricOutcomeRow`](./verdict.md) with a pass-ratio\n  count and score bar.\n- `scorer_outcomes` — score-area chips with mean-score bars.\n- `findings` — experiment-level [findings](../concepts/finding-categories.md),\n  evidence-linked.\n- `run_ids` — rendered as [run pills](./run-pill.md).\n\n**Interactions.** Run pills link to run detail; findings show evidence refs.\nToggled open/closed by clicking the table row.\n\n**Page.** Experiments (inside each comparison row).\n","outlinks":["components/verdict.md","concepts/finding-categories.md","components/run-pill.md"],"inlinks":["components/index.md","components/run-pill.md","pages/experiments.md"]},{"id":"components/failure-patterns.md","dir":"components","meta":{"type":"Component","title":"FailurePatterns","description":"Rollup of issue findings and failed gates across a scenario family to surface what recurringly breaks.","resource":"../../../review-surface/src/components/FailurePatterns.tsx","tags":["component","experiments","failure-analysis"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# FailurePatterns\n\n**Purpose.** Aggregates failure signals across all runs in a family so patterns\n(not one-off flukes) become visible.\n\n**Question answered.** *What keeps breaking across runs in this scenario?*\n\n**Data.** `RunRecord[]`: `failed_gates` and `issue_categories` summed across the\nfamily, rendered as ranked [finding categories](../concepts/finding-categories.md).\n\n**Interactions.** Links through to runs exhibiting the pattern.\n\n**Page.** Experiments (per family, beside the [trade-off scatter](./tradeoff-scatter.md)).\n","outlinks":["concepts/finding-categories.md","components/tradeoff-scatter.md"],"inlinks":["components/index.md","components/tradeoff-scatter.md","concepts/finding-categories.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"components/finding-chips.md","dir":"components","meta":{"type":"Component","title":"FindingChips","description":"Compact issue/good/note count chips summarising a run's findings.","resource":"../../../review-surface/src/components/FindingChips.tsx","tags":["component","findings","indicator"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail","experiments","runs-index"]},"body":"\n# FindingChips\n\n**Purpose.** A three-count summary of a run's findings, reused wherever a run is\nrepresented.\n\n**Question answered.** *How many issues, good marks, and notes does this run\nhave?*\n\n**Data.** `finding_counts` (`{ issue, good, note }`) — on a `RunRecord`, a\n[run pill](./run-pill.md), or the run-detail findings header.\n\n**Interactions.** Display only.\n\n**Page.** Run detail, Experiments (run pills / table), Runs list.\n","outlinks":["components/run-pill.md"],"inlinks":["components/index.md","components/run-list-item.md","components/run-pill.md","pages/run-detail.md","pages/runs-index.md"]},{"id":"components/gate-chips.md","dir":"components","meta":{"type":"Component","title":"GateChips","description":"One chip per verification gate for an at-a-glance pass/fail scan, each linking to the gate's evidence span.","resource":"../../../review-surface/src/components/GateChips.tsx","tags":["component","run-detail","gates"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# GateChips\n\n**Purpose.** A fast pass/fail read of the verification gates before reading any\nscores.\n\n**Question answered.** *Which gates passed and which failed?*\n\n**Data.** `Span[]` filtered to names starting `gate:` plus their `status`\n(derived from gate exit codes in the projection).\n\n**Interactions.** Clicking a chip selects that gate's evidence span in the\n[span tree](./span-tree.md) (`?span=`), the entry point for a failing-gate\ninvestigation.\n\n**Page.** Run detail (inside the [run header](./run-header.md)).\n","outlinks":["components/span-tree.md","components/run-header.md"],"inlinks":["components/index.md","components/run-header.md","pages/run-detail.md","personas/eval-engineer.md"]},{"id":"components/group-headline.md","dir":"components","meta":{"type":"Component","title":"GroupHeadline","description":"The one-sentence verdict above each comparison group — names the winning spec, its tier and score, the runner-up's gap, and the run worth opening first.","resource":"../../../review-surface/src/pages/ExperimentsPage.tsx","tags":["component","verdict","headline","experiments"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# GroupHeadline\n\n**Purpose.** Translates a whole revision group into a single readable sentence\nso the [reviewer](../personas/benchmark-reviewer.md) gets a verdict before any\ntable scanning.\n\n**Question answered.** *Who wins this scenario revision, by how much, and which\nrun should I open first?*\n\n**Data.** Sorted `ExperimentRecord[]`: best/runner-up `aggregate.composite_score.mean`\n→ [tier](../concepts/delivery-tiers.md); the gap between them; and the worst run\nacross the group ranked by `finding_counts.issue` then score, used to build the\n\"Start with Run NN\" link.\n\n**Interactions.** The \"Start with Run NN\" run name links to that\n[run detail](../pages/run-detail.md) — the primary hand-off into the journey's\nExplain stage. Falls back to \"No scored runs yet — rerun the benchmark\" when\nnothing is scored.\n\n**Page.** Experiments, one per revision group.\n","outlinks":["personas/benchmark-reviewer.md","concepts/delivery-tiers.md","pages/run-detail.md"],"inlinks":["components/index.md","pages/experiments.md"]},{"id":"components/json-view.md","dir":"components","meta":{"type":"Component","title":"JsonView","description":"An expandable JSON/object viewer for span payloads, with depth control, collapsible subtrees, and truncation of long strings.","resource":"../../../review-surface/src/components/JsonView.tsx","tags":["component","run-detail","payload","viewer"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# JsonView\n\n**Purpose.** Makes structured span payloads explorable rather than a wall of text.\n\n**Question answered.** *What exactly was the input/output of this span?*\n\n**Data.** Any JSON-like value or string to parse, plus a `maxExpand` depth.\n\n**Interactions.** Click arrows/objects to expand/collapse; \"more\" reveals long\nstrings; clicking a guide line collapses a subtree.\n\n**Page.** Run detail (inside [span detail](./span-detail.md) input/output sections).\n","outlinks":["components/span-detail.md"],"inlinks":["components/index.md","components/span-detail.md","pages/run-detail.md"]},{"id":"components/layout-shell.md","dir":"components","meta":{"type":"Component","title":"Layout shell","description":"The app frame — title, Experiments/Runs nav, and the \"Compare · Explain · Trace\" subtitle.","resource":"../../../review-surface/src/router.tsx","tags":["component","navigation","layout"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments","runs-index","run-detail"]},"body":"\n# Layout shell\n\n**Purpose.** Wraps every route with a fixed header (brand \"Raidar Review\",\nExperiments/Runs `NavLink`s, and the subtitle *Compare agent specs · Explain\nscores · Trace failures*) and an `<Outlet>` for page content.\n\n**Question answered.** *Where am I, and how do I switch between comparing specs\nand reading runs?*\n\n**Data.** None — pure chrome. Active-link styling from the router.\n\n**Interactions.** Two nav links toggle `/` ↔ `/runs`. Unmatched routes redirect\nto `/`.\n\n**Page.** All. Defined in `router.tsx` alongside `AppRouter`.\n","outlinks":[],"inlinks":["components/index.md","pages/index.md"]},{"id":"components/revision-movement.md","dir":"components","meta":{"type":"Component","title":"RevisionMovement","description":"Compares score / duration / token movement between scenario revisions and shows the prompt and scenario-contract diffs that may explain it — with comparability warnings.","resource":"../../../review-surface/src/components/RevisionMovement.tsx","tags":["component","experiments","revisions","diff"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# RevisionMovement\n\n**Purpose.** Answers the \"did our change help?\" question honestly — pairing the\nmetric movement with the actual contract diff and flagging when the two\nrevisions aren't even comparable.\n\n**Question answered.** *Did the scenario/prompt change move the score, and is\nthe before/after comparison valid?*\n\n**Data.**\n- `ExperimentRecord[]` per revision — `aggregate.composite_score / duration_sec /\n  uncached_input_tokens` movement.\n- `RevisionDiff[]` — `summary` (change classes), `comparable_warnings` (breaking\n  changes), and `files.scenario` / `files.prompt` line-level diffs.\n\n**Interactions.** Expand a card to reveal the contract diff; toggle\n**scenario** / **prompt** tabs; scroll the diff block. Comparability warnings\ncaution against reading the movement as causal when the contract itself changed.\n\n**Page.** Experiments (per family, below the visualisations).\n","outlinks":[],"inlinks":["components/index.md","data/projections.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"components/run-header.md","dir":"components","meta":{"type":"Component","title":"RunHeader","description":"The run-detail verdict banner — plain-language outcome, gate chips, compare-specs link, and a Technical-details disclosure for raw ids, sub-scores, and artifact paths.","resource":"../../../review-surface/src/components/RunHeader.tsx","tags":["component","run-detail","verdict"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# RunHeader\n\n**Purpose.** Leads the run with a verdict, not a number — the [eval engineer's](../personas/eval-engineer.md)\nfirst read.\n\n**Question answered.** *In one sentence, what is this run's outcome — and, on\ndemand, what are the raw ids and artifacts behind it?*\n\n**Data.** `RunRecord`: `runSummary()` over `composite_score`, `failed_gates`,\n`finding_counts.issue`, `valid`, `unscored` / `unscored_reasons`; the disclosure\nadds `quality_score`, `diagnostic_score`, run id, `status`, and `artifact_paths`\n(with copy). `synthetic` → [`Badge`](./badge.md).\n\n**Interactions.** Tier pill → detail tooltip; \"Compare agent specs\" → the\noriginating `#family-` anchor on [Experiments](../pages/experiments.md);\n\"Technical details\" toggles the raw block; copy buttons for artifact paths.\nHosts [`GateChips`](./gate-chips.md) as children.\n\n**Page.** Run detail (top).\n","outlinks":["personas/eval-engineer.md","components/badge.md","pages/experiments.md","components/gate-chips.md"],"inlinks":["components/badge.md","components/gate-chips.md","components/index.md","concepts/verdict-semantics.md","journeys/customer-journey.md","pages/run-detail.md","personas/eval-engineer.md"]},{"id":"components/run-list-item.md","dir":"components","meta":{"type":"Component","title":"RunListItem","description":"A sidebar run entry — concise label, score verdict, and finding chips — for picking a run to open.","resource":"../../../review-surface/src/components/RunListItem.tsx","tags":["component","runs","navigation"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["runs-index"]},"body":"\n# RunListItem\n\n**Purpose.** The selectable unit of the [Runs sidebar](../pages/runs-index.md).\n\n**Question answered.** *Which run am I looking at, how did it score, and does it\nhave issues?*\n\n**Data.** `RunRecord`: `id` → `runLabel`, `composite_score`/`unscored` →\n[`ScoreVerdict`](./verdict.md), `status`, `finding_counts` →\n[`FindingChips`](./finding-chips.md), `synthetic` → [`Badge`](./badge.md).\nCarries a `data-run-id` attribute (used by regression tests and selection).\n\n**Interactions.** Click selects the run (`/runs/:id`); hover reveals the full id\nand tier explanation.\n\n**Page.** Runs list (left sidebar).\n","outlinks":["pages/runs-index.md","components/verdict.md","components/finding-chips.md","components/badge.md"],"inlinks":["components/badge.md","components/index.md","pages/runs-index.md"]},{"id":"components/run-pill.md","dir":"components","meta":{"type":"Component","title":"RunPill","description":"A compact per-run chip inside an expanded comparison row — score-tier dot, run label, composite score, and finding chips, linking to the run.","resource":"../../../review-surface/src/pages/ExperimentsPage.tsx","tags":["component","runs","experiments"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# RunPill\n\n**Purpose.** Surfaces the individual runs behind a spec aggregate so the\nreviewer can jump from \"this spec lost points\" to the specific run that did it.\n\n**Question answered.** *How did this individual run do, and is it worth opening?*\n\n**Data.** `RunRecord`: `composite_score` → [tier](../concepts/delivery-tiers.md)\ndot+number, `status` (ERROR styles red), `unscored`, and\n[`FindingChips`](./finding-chips.md) from `finding_counts`. Label via `runLabel(id)`.\n\n**Interactions.** Links to `/runs/:id`. Tooltip carries the full id, tier, and\ncomposite.\n\n**Page.** Experiments (inside [experiment expansion](./experiment-expansion.md)).\n","outlinks":["concepts/delivery-tiers.md","components/finding-chips.md","components/experiment-expansion.md"],"inlinks":["components/experiment-expansion.md","components/finding-chips.md","components/index.md","pages/experiments.md"]},{"id":"components/scorecard-panel.md","dir":"components","meta":{"type":"Component","title":"ScorecardPanel","description":"The \"why it scored this\" breakdown — each scorer area's share of the composite with bars, and each metric check click-to-evidence.","resource":"../../../review-surface/src/components/ScorecardPanel.tsx","tags":["component","run-detail","scoring"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# ScorecardPanel\n\n**Purpose.** The heart of the Explain stage — decomposes the composite into\nscorer areas and individual metric checks, each traceable to evidence.\n\n**Question answered.** *Why did this run score what it did — which areas\ncontributed, and which checks passed or failed?*\n\n**Data.** `Span[]` filtered to `scorer:*` and `metric:*`; from the parsed\npayloads: `scorer_id`, `weight`, `score`, and `metric_contributions` (each\nmetric's share of the composite). Pass/fail from `metric.passed`.\n\n**Interactions.** Each check is a button (title \"…of this area\"); clicking\nselects its evidence [span](./span-tree.md). An expander shows/hides the\nbreakdown. Renders behind the \"Why it scored this\" heading that anchors the\nrun-detail view.\n\n**Page.** Run detail (middle).\n","outlinks":["components/span-tree.md"],"inlinks":["components/index.md","journeys/customer-journey.md","pages/run-detail.md","personas/eval-engineer.md"]},{"id":"components/search-panel.md","dir":"components","meta":{"type":"Component","title":"SearchPanel","description":"Full-text and regex search across a run's span payloads, returning matches that select their span.","resource":"../../../review-surface/src/components/SearchPanel.tsx","tags":["component","run-detail","search","trace"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# SearchPanel\n\n**Purpose.** Lets the [harness debugger](../personas/harness-debugger.md) find a\ncommand, error, or path anywhere in a large trace without manual scrolling.\n\n**Question answered.** *Where in this run did X happen?*\n\n**Data.** `runId` + query; results from\n[`/api/runs/:id/search`](../data/api.md) as `SearchMatch[]` (`span_id`,\n`span_name`, `scope` ∈ span_input/output/attributes, `snippet`, `match_range`).\n\n**Interactions.** Type a pattern, optional **regex** checkbox, Search; the match\ncount renders (\"N matches\"); clicking a result selects its [span](./span-tree.md)\nwith the match highlighted.\n\n**Page.** Run detail (above the span tree).\n","outlinks":["personas/harness-debugger.md","data/api.md","components/span-tree.md"],"inlinks":["components/index.md","data/api.md","journeys/customer-journey.md","pages/run-detail.md","personas/harness-debugger.md"]},{"id":"components/span-detail.md","dir":"components","meta":{"type":"Component","title":"SpanDetail","description":"The right-panel deep view of a selected span — type, status, duration, model, tokens, input/output payloads, and attached annotations.","resource":"../../../review-surface/src/components/SpanDetail.tsx","tags":["component","run-detail","spans","payload"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# SpanDetail\n\n**Purpose.** The raw evidence panel — everything known about one span.\n\n**Question answered.** *What is the full context of this span: its inputs,\noutputs, model, cost, and any annotations?*\n\n**Data.** Selected `Span`: `span_type`, `status`, `duration_ms`, `model`,\n`input_tokens` / `output_tokens`, `input_payload` / `output_payload` (rendered\nby [`JsonView`](./json-view.md)), plus span-scoped `Annotation[]`.\n\n**Interactions.** \"Annotate this span\" focuses the\n[create form](./annotation-create-form.md); a copy button copies the payload to\nthe clipboard.\n\n**Page.** Run detail (right, ~40%, shown when a span is selected).\n","outlinks":["components/json-view.md","components/annotation-create-form.md"],"inlinks":["components/index.md","components/json-view.md","journeys/customer-journey.md","pages/run-detail.md","personas/harness-debugger.md"]},{"id":"components/span-tree.md","dir":"components","meta":{"type":"Component","title":"SpanTree","description":"The hierarchical execution trace — agent steps, gates, and scoring phases — with a duration timeline, error cycling, expand/collapse, and keyboard navigation.","resource":"../../../review-surface/src/components/SpanTree.tsx","tags":["component","run-detail","trace","spans"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["run-detail"]},"body":"\n# SpanTree\n\n**Purpose.** The deepest layer — the trace walked by the\n[harness debugger](../personas/harness-debugger.md). Span names map 1:1 to the\nRaidar trace.\n\n**Question answered.** *How is the run structured, where is the error, and where\ndid the time go?*\n\n**Data.** `Span[]`: `id`, `parent_span_id` (hierarchy), `name`, `span_type`,\n`status`, `start_time_ms` / `end_time_ms` / `duration_ms` (timeline bars), plus\nspan-scoped `Annotation[]` ([chips](./annotation-chip.md)). Selection via\n`selectedSpanId` (`?span=`).\n\n**Interactions.** Click a row (`data-span-row`) to select; arrow keys\n(↑↓ move, ←→ fold), Esc clears; \"Expand all\" / \"Collapse to sections\" buttons;\nan error-cycle button steps through `status: ERROR` spans. Exposes `role=\"tree\"`.\n\n**Page.** Run detail (centre, ~60% when a span is selected).\n","outlinks":["personas/harness-debugger.md","components/annotation-chip.md"],"inlinks":["components/gate-chips.md","components/index.md","components/scorecard-panel.md","components/search-panel.md","journeys/customer-journey.md","pages/run-detail.md","personas/eval-engineer.md","personas/harness-debugger.md","personas/index.md"]},{"id":"components/tradeoff-scatter.md","dir":"components","meta":{"type":"Component","title":"TradeoffScatter","description":"A score-vs-run-time scatter, one point per run coloured by agent spec, with fast-and-good runs in the top-left.","resource":"../../../review-surface/src/components/TradeoffScatter.tsx","tags":["component","visualisation","experiments","cost-quality"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments"]},"body":"\n# TradeoffScatter\n\n**Purpose.** Makes the quality/cost trade-off visible at a glance for a whole\nscenario family.\n\n**Question answered.** *Which runs are fast **and** good? Which are slow, or\nfailed outright?*\n\n**Data.** `RunRecord[]` for the family: `composite_score` (y), `duration_ms`\n(x), `status` (failed runs marked), `agent_spec` (point colour), `id`.\n\n**Interactions.** Clicking a point opens that [run detail](../pages/run-detail.md);\nhover shows run label, score, duration, id.\n\n**Page.** Experiments (per family, beside [failure patterns](./failure-patterns.md)).\n","outlinks":["pages/run-detail.md","components/failure-patterns.md"],"inlinks":["components/failure-patterns.md","components/index.md","journeys/customer-journey.md","pages/experiments.md","personas/benchmark-reviewer.md"]},{"id":"components/verdict.md","dir":"components","meta":{"type":"Component","title":"Verdict (Tier / ScoreVerdict / ScoreBar)","description":"The shared verdict primitives — a tier pill, a tier+bar+number score verdict, and a bare score bar — that give the whole surface one consistent good/bad vocabulary.","resource":"../../../review-surface/src/components/Verdict.tsx","tags":["component","verdict","shared"],"timestamp":"2026-06-15T00:00:00Z","appears_on":["experiments","runs-index","run-detail"]},"body":"\n# Verdict (TierPill / ScoreVerdict / ScoreBar)\n\n**Purpose.** Three exports that render the [semantic verdict layer](../concepts/verdict-semantics.md)\nconsistently everywhere: `TierPill` (label chip), `ScoreVerdict`\n(tier + bar + numeric score), `ScoreBar` (proportional bar).\n\n**Question answered.** *What tier is this score — Strong, Solid, Shaky,\nFailing, or Unscored?*\n\n**Data.** A `Tier` (`label`, `color`, `blurb`) from\n[`scoreTier`](../concepts/delivery-tiers.md) / `spreadTier` / `sampleTrust`,\nplus a `score: number | null`.\n\n**Interactions.** Display only; the `blurb` surfaces as a hover tooltip.\n\n**Page.** All. Used by the comparison table, run pills, run list items, the run\nheader, and the scorecard — making this the single source of the surface's\nvisual grammar.\n","outlinks":["concepts/verdict-semantics.md","concepts/delivery-tiers.md"],"inlinks":["components/experiment-expansion.md","components/index.md","components/run-list-item.md","concepts/delivery-tiers.md","pages/experiments.md","pages/runs-index.md"]},{"id":"data/index.md","dir":"data","meta":{"type":"Data Index","title":"Data lineage","description":"How Raidar benchmark artifacts become the projections, API, and owned data behind the Review Surface.","tags":["data","lineage","architecture"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Data lineage\n\nEverything the surface shows is a **regenerable projection** of authoritative\nRaidar artifacts. The only data the surface owns is reviewer annotations.\n\n```\nexperiments/benchmarks/**            (authoritative Raidar artifacts)\n        │  scripts/build-review-data.mjs\n        ▼\ndata/runs.json · data/runs/<id>.json · data/experiments.json   (projections)\n        │  server.mjs (node:http, zero deps)\n        ▼\n/api/* endpoints\n        │\n        ▼\nReact SPA (the pages & components in this bundle)\n```\n\n| Doc | Covers |\n|---|---|\n| [Source artifacts](./source-artifacts.md) | What authoritative files are read, and the fields pulled from each |\n| [Projections](./projections.md) | The three projection files and the transformations that build them |\n| [API](./api.md) | Every endpoint `server.mjs` serves |\n| [Owned data](./owned-data.md) | User annotations — the surface's only writable state |\n\nBuild commands (from repo root): `make review-surface-data` (project) →\n`make review-surface-build` → `make review-surface-serve`.\n","outlinks":["data/source-artifacts.md","data/projections.md","data/api.md","data/owned-data.md"],"inlinks":["index.md"]},{"id":"data/api.md","dir":"data","meta":{"type":"API","title":"API endpoints","description":"Every route served by the zero-dependency node:http server — read endpoints over the projections plus annotation CRUD.","resource":"../../../review-surface/server.mjs","tags":["data","api","server"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# API endpoints\n\n`server.mjs` is a zero-dependency `node:http` server (binds `127.0.0.1`, port\n`REVIEW_SURFACE_PORT` or `5950`). It serves the projection files as read-only\nJSON and the SPA static assets, plus annotation CRUD.\n\n## Read endpoints\n\n| Method · Route | Returns |\n|---|---|\n| `GET /api/runs` | the `runs` array from `runs.json` (`{ runs: RunRecord[] }`) → [Runs list](../pages/runs-index.md), pills |\n| `GET /api/experiments` | `{ experiments[], revision_diffs[] }` → [Experiments](../pages/experiments.md) |\n| `GET /api/runs/detail/:id` | `{ run, spans, annotations }` → [Run detail](../pages/run-detail.md) |\n| `GET /api/runs/:id/outline` | summary: `span_type_counts`, `tool_calls.by_name[]`, `errors[]`, annotations |\n| `GET /api/runs/:id/search` | `{ matches[], truncated }` over span payloads — params `pattern`, `regex`, `case_sensitive`, `max_matches` (default 50, cap 200), `context_chars` (default 80, cap 300). Caps at **10 matches per span-scope** (input/output/attributes); each `snippet` wraps the hit in `<<MATCH>>…<<END>>` markers; invalid regex returns `{ matches: [], error: 'invalid regex' }` → [Search](../components/search-panel.md) |\n| `GET /api/spans/:id/payload` | paginated single-span payload — params `target` (input/output), `max_chars`, `offset` |\n| `GET /api/annotations?run_id=` | merged raidar + user `Annotation[]` (400 if `run_id` is missing) |\n\n## Write endpoints\n\n| Method · Route | Body → Result |\n|---|---|\n| `POST /api/annotations` | `{ run_id, span_id?, kind, note }` → created `user` annotation (`id` `user-<uuid>`, note ≤4000 chars) |\n| `DELETE /api/annotations/:id` | `{ ok: true }` — only `user-`prefixed annotations; Raidar findings immutable |\n\n## Static serving\n\n`/` → `index.html`; `/<path>` → file from `dist/` if present, else SPA fallback\nto `index.html`. Requests that normalise outside `dist/` are rejected **403**\n(path-traversal guard); if the app hasn't been built, static requests return\n**503** with a \"run npm install && npm run build\" hint. The client wrapper is\n[`src/api/client.ts`](../../../review-surface/src/api/client.ts). Writes land in\n[owned data](./owned-data.md).\n\n## Verification\n\nDocumented against `review-surface/server.mjs` directly (2026-06-15): all\nendpoints, params, annotation fields, and the merge/no-locking behaviour\nconfirmed line-by-line.\n","outlinks":["pages/runs-index.md","pages/experiments.md","pages/run-detail.md","components/search-panel.md","data/owned-data.md"],"inlinks":["components/annotation-create-form.md","components/search-panel.md","data/index.md","pages/experiments.md","pages/run-detail.md","pages/runs-index.md"]},{"id":"data/owned-data.md","dir":"data","meta":{"type":"Data Source","title":"Owned data — user annotations","description":"The one piece of state the surface owns and writes — reviewer annotations stored in data/user-annotations.json.","resource":"../../../review-surface/server.mjs","tags":["data","owned","annotations","write"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Owned data — user annotations\n\nEverything else the surface shows is regenerable from\n[source artifacts](./source-artifacts.md). **User annotations are the sole\nexception** — the only data the surface creates and owns.\n\n## Storage\n\n`review-surface/data/user-annotations.json` — a flat array. Each record:\n\n| Field | Value |\n|---|---|\n| `id` | `user-<uuid>` |\n| `run_id`, `span_id?` | references into the projection |\n| `kind` | issue / good / note (reviewer-chosen) |\n| `note` | text, ≤ 4000 chars |\n| `source` | `\"user\"` |\n| `created_at` | epoch ms at POST |\n| `category` | fixed `\"annotation\"` |\n| `evidence` | `[]` (user notes carry no evidence refs) |\n\n## Lifecycle\n\n- **Write** — `POST /api/annotations` appends and persists the whole array\n  (`fs.writeFileSync`).\n- **Delete** — `DELETE /api/annotations/:id` filters and re-persists; only\n  `user-`prefixed ids are deletable.\n- **Read/merge** — at read time, `annotationsForRun(runId)` concatenates the\n  projected Raidar findings (from `runs/<id>.json`) with user annotations\n  filtered to that `run_id`: `[...generated, ...user]`.\n\n## Caveat\n\nFile-based with no locking — concurrent writers can lose data; the surface is a\nsingle-reviewer local tool, not a multi-client service. Written via the\n[create form](../components/annotation-create-form.md), surfaced in\n[annotation cards](../components/annotation-cards.md).\n","outlinks":["data/source-artifacts.md","components/annotation-create-form.md","components/annotation-cards.md"],"inlinks":["components/annotation-create-form.md","data/api.md","data/index.md"]},{"id":"data/projections.md","dir":"data","meta":{"type":"Data Projection","title":"Projections","description":"The three projection files the build script writes, and the key transformations (span projection, scoring aggregation, gate history, findings→annotations, revision diffs) that produce them.","resource":"../../../review-surface/scripts/build-review-data.mjs","tags":["data","projection","transformation"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Projections\n\n`build-review-data.mjs` writes three files under `review-surface/data/`.\n\n## Output files\n\n| File | Shape | Key fields |\n|---|---|---|\n| `data/runs.json` | `{ runs: RunRecord[] }` (index; `/api/runs` returns `.runs`) | `id`, `scenario`, `revision`, `agent_spec`, `experiment_id`, `composite_score`, `status`, `unscored`/`unscored_reasons`, `valid`, `finding_counts`, `issue_categories`, `failed_gates`, `artifact_paths` |\n| `data/runs/<id>.json` | `{ run, spans, annotations }` | full [`RunDetail`](../pages/run-detail.md) — projected spans + merged annotations |\n| `data/experiments.json` | `{ experiments[], revision_diffs[] }` | per-spec `aggregate`, `sample`, `rerun`, `findings`, `run_ids` + `RevisionDiff[]` |\n\n## Key transformations\n\n| Transformation | From → To |\n|---|---|\n| **Span projection** | `run.traces[]` events → `Span[]`. `assistant_message`→`LLM_GENERATION`, `bash_command`/`tool_call`→`TOOL_CALL`, else `INTERNAL`; durations from consecutive timestamps; gate-result events patch the preceding command span's status/output. |\n| **Gate history** | `run.gate_history[]` → a \"verification gates\" parent span + one `gate:<name>` child per gate (status from `exit_code`, payload carries `failure_category`, `is_repeat`, `stdout`, `stderr`). |\n| **Scoring** | `run.scores` → a \"scoring\" section: `scorer:<id>@<v>` spans and `metric:<id>` spans, parented via `metric_contributions`. |\n| **Evidence sections** | `run.scores` → parallel spans: requirements, execution validity (+ performance gates), process metrics, artifacts & evidence (+ workspace diff). |\n| **Findings → annotations** | `findings.json` → `Annotation[]` with pre-computed `span_id` (e.g. `failed-gate`→`gate:<ref>`, `judge-review`/`deterministic-cap`→metric span, category→section map). `source: raidar`, immutable. |\n| **Run status** | `unscored` OR any failed validity check OR `functional.passed === false` → `ERROR`; else `OK`. |\n| **Experiment aggregation** | per-run scores → `metric_outcomes` (pass/fail counts, `pass_rate`, `mean_score`), `scorer_outcomes`, and stat blocks (mean/median/stddev/min/max) for composite, quality, duration, tokens. |\n| **Revision diffing** | two revisions' scenario.yaml + task.md → LCS line diffs + change classification; `comparable_warnings` flag breaking contract/prompt changes (see [revision movement](../components/revision-movement.md)). |\n| **Sample adequacy** | preserved as-is from `experiment-summary.json` (`minimum_met`, `preferred_met`, `sample_adequacy`) — drives [confidence](../concepts/sample-confidence.md). |\n\nThe projected types are defined in\n[`src/utils/types.ts`](../../../review-surface/src/utils/types.ts).\n","outlinks":["pages/run-detail.md","components/revision-movement.md","concepts/sample-confidence.md"],"inlinks":["components/index.md","concepts/sample-confidence.md","data/index.md","data/source-artifacts.md","journeys/customer-journey.md"]},{"id":"data/source-artifacts.md","dir":"data","meta":{"type":"Data Source","title":"Source artifacts","description":"The authoritative Raidar files under experiments/benchmarks/** (and scenarios/**) that the build script reads, with the fields pulled from each.","resource":"../../../review-surface/scripts/build-review-data.mjs","tags":["data","source","artifacts"],"timestamp":"2026-06-15T00:00:00Z"},"body":"\n# Source artifacts\n\n`scripts/build-review-data.mjs` reads from `experiments/benchmarks/**` and\n`scenarios/**`. These are **authoritative**; the surface never mutates them.\n\n## Per-experiment\n\n| File |
