# Phase 1 pilot (implementation-plan §3, 1.P): one validated 8-checkpoint problem
# (forge, oracle-validation.md) x {baseline, guided} x 5 blocks, continue mode.
# Validate: make experiment-validate EXPERIMENT=examples/pilot/experiment.yaml
# Lock:     make experiment-lock EXPERIMENT=examples/pilot/experiment.yaml
schema_version: 1
id: pilot-forge
description: Does the guided treatment (rules, skill, lint config, turn-end check, review loop) improve correctness and inertia on forge?

problems:
  # SCB Harbor dataset, pinned to scb-problems@38d627ecf668 (resolved by the WS-B registry).
  - ref: scb/forge@38d627ecf668

runtime:
  language: python
  environment: docker
  compose_init: true

agents:
  # The pilot's single AgentSpec. Plan 1.P names Claude Code; by user directive (and
  # ADR-001 §2.7) every real-LLM trial uses codex-cli + gpt-6-luna at low effort.
  - id: codex-luna
    harness: codex-cli
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1

protocol:
  progression: continue
  agent_timeout_sec: 1800
  verifier_timeout_sec: 900
  snapshot_source: artifact

factors: [condition]

conditions:
  - id: baseline
    components: []
  # The guided treatment (design memo §10.4; plan C4): working rules, a skill,
  # lint config, a turn-end self-check and an implement -> review -> fix loop.
  - id: guided
    components:
      - use: rules-file@1
        files: [components/guided/AGENTS.md]
      - use: skills@1
        files: [components/guided/skills/checkpoint-discipline]
      - use: lint-config@1
        files: [components/guided/ruff.toml]
      # Codex maps stop-hook@1 to `notify`: it runs at each turn end, but its output
      # is not shown to the agent (a Claude Stop hook's would be). ruff/mypy are
      # scorer tools and are not in the agent image, so the check is a byte-compile.
      - use: stop-hook@1
        with:
          command: python3 -m compileall -q . >/dev/null 2>&1 || true
      # Reviewer sessions use the arm's own AgentSpec and are billed to the arm.
      - use: review-loop@1
        with:
          max_review_rounds: 2

arms:
  - id: baseline
    condition: baseline
    agent: codex-luna
  - id: guided
    condition: guided
    agent: codex-luna

assessment:
  scorers: [correctness@1, code-quality@1, resource-usage@1, process-compliance@1]
  # Omitted headline_policy: the lock picks the default by K (K=8 -> scb-canonical@1).

analysis:
  baseline_arm: baseline
  blocks: 5
  seed: 20260929
  concurrency: 2
  # Verdict thresholds, pinned by the lock before any data is seen (memo §2.3).
  # raidar analyze reads them from the lock; a command-line override is labelled.
  min_pairs: 5
  max_exclusion_fraction: 0.2
  alpha: 0.05
  min_effects: {}
