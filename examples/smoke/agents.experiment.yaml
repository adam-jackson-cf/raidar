# Operational agent smoke (make smoke-agents [SMOKE_ARM=codex|claude]): the
# smoke problem once per harness the Python pack bakes in. The agent is the factor, so
# each arm is one harness; SMOKE_ARM runs one arm. Versions equal the pack.yaml pins
# (raidar plan refuses any other). Not a benchmark: one block, correctness only.
schema_version: 1
id: smoke-agents
description: Operational smoke of every pack harness on the experiment path; not a benchmark.

problems:
  - ref: scb/circuit_eval.checkpoint_1@38d627ecf668

agents:
  - id: codex
    harness: codex-cli
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    version: 0.156.1
  - id: claude
    harness: claude-code
    provider: anthropic
    model: claude-sonnet-4-6
    reasoning_effort: low
    version: 2.1.285

protocol:
  agent_timeout_sec: 1800

factors: [agent]

conditions:
  - id: baseline
    components: []

arms:
  - id: codex
    condition: baseline
    agent: codex
  - id: claude
    condition: baseline
    agent: claude

assessment:
  scorers: [correctness@1]
  headline_policy: scb-canonical-oneshot@1

analysis:
  baseline_arm: codex
  blocks: 1
  seed: 20260930
