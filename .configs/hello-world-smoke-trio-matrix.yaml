matrix:
  experiment:
    timeout_sec: 1800
    repeats: 1
    repeat_parallel: 1
    retry_void: 0
  agents:
    - harness: codex-cli
      provider: openai
      model: gpt-5.5
      reasoning_effort: low
    - harness: gemini
      provider: google
      model: gemini-3-flash-preview
    - harness: claude-code
      provider: anthropic
      model: claude-haiku-4-5
