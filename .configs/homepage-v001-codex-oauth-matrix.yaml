matrix:
  experiment:
    timeout_sec: 1800
    repeats: 5
    repeat_parallel: 1
    retry_void: 0
  agents:
    - harness: codex-cli
      provider: openai
      model: gpt-5.5
      reasoning_effort: low
    - harness: codex-cli
      provider: openai
      model: gpt-5.5
      reasoning_effort: medium
    - harness: codex-cli
      provider: openai
      model: gpt-5.4-mini
      reasoning_effort: low
    - harness: codex-cli
      provider: openai
      model: gpt-5.3-codex-spark
      reasoning_effort: low
